<!doctype html>
<html lang="en">
<head>

  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #121a21; color: #edf5f8; }

    main { box-sizing: border-box; width: min(42rem, calc(100% - 2rem)); padding: clamp(1.5rem, 5vw, 3rem); border: 1px solid #405361; border-radius: 1rem; background: #1a2732; }

    p { color: #c4d4de; line-height: 1.55; }
    output { display: inline-block; padding: .45rem .65rem; border-radius: .35rem; background: #293e40; color: #a8f1cf; font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <main>
    <h1>Nathan AI Hosting Check</h1>
