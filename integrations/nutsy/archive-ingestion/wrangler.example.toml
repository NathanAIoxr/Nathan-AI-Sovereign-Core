name = "nutsy-archive-ingestion"
main = "worker.ts"
compatibility_date = "2026-11-21"
workers_dev = false
preview_urls = false

[observability]
enabled = true

[observability.traces]
enabled = true
head_sampling_rate = 0.1

[vars]
SOURCE_USER_AGENT = "NutsyArchive/1.0 (replace with a public contact)"
ARCHIVE_TOPICS = '[{"source":"wikimedia","input":"Henry Ford"},{"source":"loc","input":"Henry Ford Highland Park"}]'

[[d1_databases]]
binding = "ARCHIVE_CATALOG"
database_name = "REPLACE_WITH_D1_NAME"
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "ARCHIVE_RAW"
bucket_name = "replace-with-private-r2-bucket"

[[kv_namespaces]]
binding = "WIKIMEDIA_TOKENS"
id = "00000000000000000000000000000000"

# Start scheduling only after the local and bound preview checks pass.
# [triggers]
# crons = ["17 */6 * * *"]
