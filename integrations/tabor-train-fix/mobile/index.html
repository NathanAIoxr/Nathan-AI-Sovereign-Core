<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tabor Train — Voice Vault</title><style>body{font:16px system-ui;max-width:700px;margin:auto;padding:1.5rem;background:#111827;color:white}textarea,input,button{font:inherit;padding:.7rem;margin:.4rem 0;width:100%;box-sizing:border-box}textarea{height:180px}button{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><h1>Tabor Train of Truth</h1><p>Verbatim capture and mirror-text preview. Nothing is transmitted until you press Send.</p><label>Gateway URL<input id="endpoint" placeholder="https://your-authorized-worker.workers.dev"></label><label>Bearer token<input id="token" type="password" autocomplete="off"></label><label>Original words<textarea id="words" placeholder="Type or dictate here"></textarea></label><button id="mirror">Mirror locally</button><button id="send">Send to gateway</button><pre id="output" aria-live="polite"></pre><script>const $=id=>document.getElementById(id);$('mirror').onclick=()=>{$('output').textContent=[...$('words').value].reverse().join('')};$('send').onclick=async()=>{try{const u=new URL($('endpoint').value);if(u.protocol!=='https:')throw Error('HTTPS required');const r=await fetch(u.origin+'/v1/lock',{method:'POST',headers:{'authorization':'Bearer '+$('token').value,'content-type':'application/json'},body:JSON.stringify({content:$('words').value,anchor:'QI',tier:1})});$('output').textContent=JSON.stringify(await r.json(),null,2)}catch(e){$('output').textContent=String(e)}};</script></body></html>
