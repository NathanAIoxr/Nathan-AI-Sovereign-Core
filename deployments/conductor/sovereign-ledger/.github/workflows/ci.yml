name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:py
      # Parity gate: regenerate vectors from Python; any diff means TS and Python schemes drifted.
      - name: Vectors are current
        run: |
          cd python && python3 gen_vectors.py && cd ..
          git diff --exit-code test/vectors.json

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply nathan-ledger --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Remote chain verification
        run: python3 python/ledger.py remote-verify
        env:
          LEDGER_WORKER_URL: ${{ secrets.LEDGER_WORKER_URL }}
          LEDGER_HMAC_SECRET: ${{ secrets.LEDGER_HMAC_SECRET }}
