# External anchor: records the ledger head hash in git history, so rewriting the whole
# database chain would also require rewriting signed GitHub history.
name: Anchor ledger head
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  anchor:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch head and append
        run: |
          python3 python/ledger.py remote-head >> anchors/heads.jsonl
          git config user.name "ledger-anchor-bot"
          git config user.email "ledger-anchor-bot@users.noreply.github.com"
          git add anchors/heads.jsonl
          git commit -m "anchor: ledger head $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing to commit"
          git push
        env:
          LEDGER_WORKER_URL: ${{ secrets.LEDGER_WORKER_URL }}
          LEDGER_HMAC_SECRET: ${{ secrets.LEDGER_HMAC_SECRET }}
