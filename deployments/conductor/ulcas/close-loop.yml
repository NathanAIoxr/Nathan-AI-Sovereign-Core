# Install under .github/workflows/ only for the registered repository after configuring ingress.
name: ULCAS Node X CI verification
on:
  workflow_dispatch:
    inputs:
      cid:
        description: Original github.verify crossing CID
        type: string
        required: true
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test Node X
        id: checks
        run: python3 -m unittest discover -s deployments/conductor/ulcas -v
      - name: Return CI result to the original crossing
        if: ${{ always() && (steps.checks.outcome == 'success' || steps.checks.outcome == 'failure') }}
        env:
          CID: ${{ inputs.cid }}
          CHECKS: ${{ steps.checks.outcome }}
          REVISION: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          INGRESS: ${{ secrets.ULCAS_CI_INGRESS }}
          TOKEN: ${{ secrets.ULCAS_CI_TOKEN }}
          ACCESS_ID: ${{ secrets.ULCAS_ACCESS_ID }}
          ACCESS_SECRET: ${{ secrets.ULCAS_ACCESS_SECRET }}
        run: |
          jq -n --arg cid "$CID" --arg sha "$REVISION" --arg conclusion "$CHECKS" \
            --arg id "ci-${RUN_ID}-${ATTEMPT}" --argjson run "$RUN_ID" \
            '{cid:$cid,event_id:$id,data:{sha:$sha,run_id:$run,conclusion:$conclusion}}' |
          curl --fail-with-body --silent --show-error --max-time 10 \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -H "CF-Access-Client-Id: $ACCESS_ID" -H "CF-Access-Client-Secret: $ACCESS_SECRET" \
            --data-binary @- "$INGRESS"
