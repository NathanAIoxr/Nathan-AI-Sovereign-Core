name = "nathan-ai-conductor"
main = "worker.mjs"
compatibility_date = "2026-11-19"
workers_dev = false

[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[observability.traces]
enabled = true
head_sampling_rate = 0.1

[[durable_objects.bindings]]
name = "STATE"
class_name = "ProjectConductor"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ProjectConductor"]

[[d1_databases]]
binding = "LEDGER"
database_name = "nathan-ai-conductor-ledger"
database_id = "3279cbc0-0e73-4b07-9bc2-47ab0c3b95c2"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "AUDIT"
bucket_name = "nathan-ai-conductor-audit"

[[durable_objects.bindings]]
name = "TIME"
class_name = "ZoneClock"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ZoneClock"]

[[d1_databases]]
binding = "TIME_WEBSITE"
database_name = "sovereign-website-core-holding"
database_id = "f2b38272-3774-4c7a-a2ee-3d5700a74fe6"

[[d1_databases]]
binding = "TIME_BOOKS"
database_name = "sovereign-book-series-holding"
database_id = "d8f6564f-9146-4c51-b48a-428e9aab1063"

[[d1_databases]]
binding = "TIME_APPS"
database_name = "sovereign-apps-holding"
database_id = "3f496ed8-0d01-4877-817c-ea7bc8b7fd36"

[[d1_databases]]
binding = "TIME_GAMES"
database_name = "sovereign-games-holding"
database_id = "30ba63b6-4b12-4ecc-97a1-d94b058b6c6b"

[[d1_databases]]
binding = "TIME_COMMAND"
database_name = "zone-tap-that-command-center-db"
database_id = "ed2bcc51-ce90-443c-90ff-ed284f7c0a58"

[[d1_databases]]
binding = "TIME_ARCADE"
database_name = "zone-tap-that-arcade-db"
database_id = "4d34a050-53ad-464c-b075-1295ca6a1b65"

[[d1_databases]]
binding = "TIME_PUMPKIN"
database_name = "zone-collyn-tabor-pumpkin-patch-db"
database_id = "46364868-ac37-4180-b8f8-d4ec2ba0b670"

[vars]
CHEIR_ACCESS_AUD = "5ee928ec18ae9f746f5ee81971ef12317cd542a4b795f7c5ab96300ddde805fc"

[[kv_namespaces]]
binding = "ZONE_KV"
id = "f0c0ef9b5a964825ba2508f8dd7ca6b8"

[[d1_databases]]
binding = "VAULT_READ"
database_name = "tabor-holding-vault"
database_id = "2744aea4-b218-41e9-ab21-a04f25c10475"

[[queues.producers]]
binding = "EMIT_BUS"
queue = "nathan-ai-cheironomer-events"

[ai]
binding = "AI"

# The standard Tabor Train Worker provides native Queue push and minute Cron.
# Cheironomer runs its ten-second Durable Object alarm in this dispatch Worker.

# Nathan AI node template. Access is limited to fixed registry queries in the Worker.
[[d1_databases]]
binding = "NODE_FLEET_READ"
database_name = "tabor-fleet-registry"
database_id = "00e422eb-5222-4892-8f90-74aaf8ab0518"

[[d1_databases]]
binding = "NODE_CORE_READ"
database_name = "nathan-sovereign-vault"
database_id = "d3043fdb-4c19-4387-b634-1257eb4b7168"

[[d1_databases]]
binding = "NODE_COMPUTE_READ"
database_name = "tabor-database-registry"
database_id = "af177f57-154c-41a1-a5cd-5602568a4a2f"

# Full-Spectrum Sovereign Engine receipt ledger.
[[d1_databases]]
binding = "ENGINE_DB_PRIMARY"
database_name = "nathan-ai-sovereign-engine"
database_id = "d0d366dc-7773-4384-b3f6-d671cb649d36"
migrations_dir = "sovereign-engine/migrations"

[[d1_databases]]
binding = "ENGINE_DB_SHARD_2"
database_name = "nathan-ai-sovereign-engine-shard-2"
database_id = "5870d835-eb05-42dc-b1b1-1edf7ce75562"
migrations_dir = "sovereign-engine/migrations"

[[r2_buckets]]
binding = "ENGINE_OVERFLOW_R2"
bucket_name = "nathan-ai-sovereign-engine-overflow"
