<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anubis &amp; Karma · End That War</title>
  <meta name="description" content="An interactive story based on Nathan Tabor's Scales of Anubis and Karma Balance Sheet.">
  <link rel="stylesheet" href="/site.css">
  <script type="module" src="/client.mjs"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/">TABOR WORLD <span> / 0 × 1</span></a>
    <nav aria-label="Project"><a href="/read">Read</a><a href="https://tabor-domino.nathantaboract.workers.dev">Domino</a></nav>
  </header>
  <main class="page">
    <section class="hero" aria-labelledby="title">
      <div>
        <p class="overline">A Nathan Tabor concept</p>
        <h1 id="title">Anubis <em>&amp;</em><br>Karma</h1>
        <p class="subtitle">Sin vs righteous <span>·</span> 0 vs 1</p>
      </div>
      <div class="geometry" aria-hidden="true">
        <div class="orbit"></div><div class="orbit orbit-inner"></div>
        <div class="pivot"></div><div class="beam"></div><div class="scale scale-zero">0</div><div class="scale scale-one">1</div>
      </div>
    </section>
    <section class="court" aria-labelledby="game-title">
      <div class="case" id="case">
        <p class="overline" id="progress">Case 1 of 3</p>
        <h2 id="game-title" tabindex="-1">The Dry Gate</h2>
        <p id="scenario"></p>
        <div class="choices" id="choices"></div>
        <p id="feedback" class="feedback" role="status"></p>
        <button class="button" id="reset" type="button" hidden>Play again</button>
        <noscript><p>Enable JavaScript to play, or <a href="/read">read the story</a>.</p></noscript>
      </div>
      <aside aria-label="Evidence and consequence" class="ledger">
        <h3>The Scales of Anubis</h3>
        <p id="evidence"></p>
        <h3>The Karma Balance Sheet</h3>
        <p id="effect"></p>
        <ol id="stones" aria-label="Closed cases"><li>01</li><li>02</li><li>03</li></ol>
      </aside>
    </section>
    <div class="entries">
      <a href="https://tabor-anubis.nathantaboract.workers.dev">The Scales of Anubis <span aria-hidden="true">↗</span></a>
      <a href="https://tabor-karma.nathantaboract.workers.dev">The Karma Balance Sheet <span aria-hidden="true">↗</span></a>
      <a href="/read">The Last Weighing <span aria-hidden="true">↗</span></a>
    </div>
  </main>
  <footer><a href="https://tabor-world.nathantaboract.workers.dev">Tabor World</a><a href="https://github.com/NathanAIoxr/Nathan-AI-Sovereign-Core/tree/main/standalone-apps/anubis-and-karma">Source on GitHub</a></footer>
</body>
</html>
