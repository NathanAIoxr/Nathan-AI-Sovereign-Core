<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Nathan AI — Sudoku Master</title>
  <link rel="stylesheet" href="./sudoku.css">
</head>
<body>
  <main>
    <header><a href="./index.html">App station</a><h1>Sudoku Master</h1><p>Nathan AI · Nathan Tabor</p></header>
    <section aria-label="Sudoku board">
      <div class="toolbar">
        <label for="level">Difficulty</label>
        <select id="level"><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select>
        <button id="new" type="button">New puzzle</button>
      </div>
      <div id="board" aria-label="Puzzle cells"></div>
      <div id="numbers" aria-label="Number pad"></div>
      <div class="actions">
        <button id="notes" type="button" aria-pressed="false">Notes</button>
        <button id="erase" type="button">Erase</button>
        <button id="hint" type="button">Hint</button>
        <button id="check" type="button">Check</button>
        <button id="solve" type="button">Solve</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script type="module" src="./sudoku.mjs"></script>
</body>
</html>
