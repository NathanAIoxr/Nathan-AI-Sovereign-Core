<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Category Challenge</title><link rel="stylesheet" href="./quiz.css"></head>
<body><main><header><h1>Category Challenge</h1><p>Choose a category and answer three short questions.</p></header>
<nav aria-label="Categories" id="categories"></nav>
