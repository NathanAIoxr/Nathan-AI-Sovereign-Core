name: TaborGames
options:
  bundleIdPrefix: com.nathantabor
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_LSRequiresIPhoneOS: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SUPPORTS_MACCATALYST: NO
targets:
  Scrambler:
    type: application
    platform: iOS
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: Scrambler
        PRODUCT_BUNDLE_IDENTIFIER: com.nathantabor.scrambler
    sources:
      - path: Sources
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Generated/Scrambler/Web
        type: folder
        buildPhase: resources
      - path: Generated/Scrambler/Assets.xcassets
  YardArcade:
    type: application
    platform: iOS
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: Tabor Yard Arcade
        PRODUCT_BUNDLE_IDENTIFIER: com.nathantabor.yardarcade
    sources:
      - path: Sources
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Generated/YardArcade/Web
        type: folder
        buildPhase: resources
      - path: Generated/YardArcade/Assets.xcassets
  Sudoku:
    type: application
    platform: iOS
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: Sudoku Master
        PRODUCT_BUNDLE_IDENTIFIER: com.nathantabor.sudokumaster
    sources:
      - path: Sources
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Generated/Sudoku/Web
        type: folder
        buildPhase: resources
      - path: Generated/Sudoku/Assets.xcassets
  Retro:
    type: application
    platform: iOS
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: Tabor Retro Lab
        PRODUCT_BUNDLE_IDENTIFIER: com.nathantabor.retrolab
    sources:
      - path: Sources
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Generated/Retro/Web
        type: folder
        buildPhase: resources
      - path: Generated/Retro/Assets.xcassets
  ScramblerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Scrambler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nathantabor.scrambler.uitests
        GENERATE_INFOPLIST_FILE: YES
  YardArcadeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: YardArcade
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nathantabor.yardarcade.uitests
        GENERATE_INFOPLIST_FILE: YES
  SudokuUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Sudoku
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nathantabor.sudokumaster.uitests
        GENERATE_INFOPLIST_FILE: YES
  RetroUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Retro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nathantabor.retrolab.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Scrambler:
    build:
      targets:
        Scrambler: all
    test:
      targets: [ScramblerUITests]
  YardArcade:
    build:
      targets:
        YardArcade: all
    test:
      targets: [YardArcadeUITests]
  Sudoku:
    build:
      targets:
        Sudoku: all
    test:
      targets: [SudokuUITests]
  Retro:
    build:
      targets:
        Retro: all
    test:
      targets: [RetroUITests]
