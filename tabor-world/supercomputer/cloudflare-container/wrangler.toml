name = "tabor-linux-server"
main = "src/index.js"
compatibility_date = "2026-11-18"

[[containers]]
class_name = "TaborServer"
image = "./Dockerfile"
max_instances = 1

[[durable_objects.bindings]]
name = "TABOR_SERVER"
class_name = "TaborServer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TaborServer"]
