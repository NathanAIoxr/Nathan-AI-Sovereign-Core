name = "nathan-ai-sovereign-2x"
main = "src/index.js"
compatibility_date = "2026-11-17"
workers_dev = true

[observability]
enabled = true

[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "REGISTRY"
database_name = "tabor-database-registry"
database_id = "af177f57-154c-41a1-a5cd-5602568a4a2f"

[[d1_databases]]
binding = "COMPUTE"
database_name = "nathan-supercomputer-2x"
database_id = "46a04265-4187-4641-8809-2e184e5eb185"

[[services]]
binding = "MESH_EXECUTOR"
service = "nathan-sovereign-fp64-executor"

[[services]]
binding = "TRUE_CLOUD"
service = "tabor-true-cloud-computing"

[[services]]
binding = "SOVEREIGN_UNIT"
service = "sovereign-ai-unit"

[[services]]
binding = "WORLD_HUB"
service = "tabor-world-hub"

[[services]]
binding = "FLEET"
service = "tabor-compute-fleet"
