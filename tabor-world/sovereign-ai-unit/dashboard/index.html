<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nathan AI | Sovereign Jobs</title><style>body{font:16px system-ui;max-width:960px;margin:auto;padding:20px;background:#101723;color:#eaf0f7}input,button{font:inherit;padding:9px;margin:4px;background:#263448;color:white;border:1px solid #71839b;border-radius:6px}input{max-width:100%;width:270px}button{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1b283a;padding:16px;border-radius:8px}label{display:block;margin-top:12px}</style><h1>NATHAN AI · Sovereign Compute</h1><p>TRUE CLOUD COMPUTING BY NATHAN TABOR · CLEAR → BUILD → INTEGRATE → VERIFY</p><label>Box 0 API endpoint <input id="url" placeholder="https://your-box-zero.workers.dev"></label><label>Access token (held in this page only) <input id="token" type="password" autocomplete="off"></label><label>Project <input id="project" value="default"></label><label>Prompt <input id="prompt" placeholder="Inference input"></label><label>Maximum USD budget <input id="budget" type="number" min="0" step=".01" value="1"></label><p><button id="submit">Submit job</button><button id="jobs">Refresh jobs</button><button id="capacity">Capacity</button></p><pre id="output" aria-live="polite">Connect to your authenticated Box 0 endpoint.</pre><script>
async function call(path,method="GET",body){const base=document.getElementById("url").value.replace(/\/$/,"");if(!base.startsWith("https://"))throw Error("HTTPS endpoint required");const r=await fetch(base+path,{method,headers:{"authorization":"Bearer "+document.getElementById("token").value,"x-project-id":document.getElementById("project").value,"idempotency-key":crypto.randomUUID(),"content-type":"application/json"},body:body?JSON.stringify(body):undefined});return {http:r.status,data:await r.json()}}
async function run(fn){const output=document.getElementById("output");output.textContent="Loading…";try{output.textContent=JSON.stringify(await fn(),null,2)}catch(e){output.textContent=String(e)}}
document.getElementById("submit").onclick=()=>run(()=>call("/v1/jobs","POST",{input:document.getElementById("prompt").value,max_cost_usd:Number(document.getElementById("budget").value),workload:"inference"}));
document.getElementById("jobs").onclick=()=>run(()=>call("/v1/jobs"));
document.getElementById("capacity").onclick=()=>run(()=>call("/v1/capacity"));
</script></html>
