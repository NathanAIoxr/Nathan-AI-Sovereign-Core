name = "tabor-family-federation"
main = "src/index.mjs"
compatibility_date = "2026-11-18"
workers_dev = true
preview_urls = false

[observability]
enabled = true

[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "REGISTRY"
database_name = "tabor-database-registry"
database_id = "af177f57-154c-41a1-a5cd-5602568a4a2f"

[[services]]
binding = "TRUE_CLOUD"
service = "tabor-true-cloud-computing"

[[services]]
binding = "SOVEREIGN_COMPUTE"
service = "nathan-ai-sovereign-2x"

[[services]]
binding = "WORLD_HUB"
service = "tabor-world-hub"
