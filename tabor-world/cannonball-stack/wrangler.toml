name = "tabor-cannonball-stack"
main = "src/index.mjs"
compatibility_date = "2026-11-18"
workers_dev = true
preview_urls = false

[observability]
enabled = true

[[services]]
binding = "SUPERCOMPUTER"
service = "nathan-ai-sovereign-2x"

[[services]]
binding = "TRUE_CLOUD"
service = "tabor-true-cloud-computing"

[[services]]
binding = "FEDERATION"
service = "tabor-family-federation"

[[services]]
binding = "LIBRARY"
service = "tabor-universal-library-engine"
