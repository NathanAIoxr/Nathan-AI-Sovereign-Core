name: Nathan Tabor 2X+ Sovereign Supercomputer

on:
  pull_request:
    paths:
      - 'app-factory/nathan-ai/sovereign-supercomputer/**'
      - 'app-factory/sovereign-hub/cloudflare/package-lock.json'
      - '.github/workflows/nathan-sovereign-supercomputer.yml'
  push:
    branches: [main]
    paths:
      - 'app-factory/nathan-ai/sovereign-supercomputer/**'
      - 'app-factory/sovereign-hub/cloudflare/package-lock.json'
      - '.github/workflows/nathan-sovereign-supercomputer.yml'
  workflow_dispatch:
    inputs:
      qualify_live:
        description: Qualify the live expanded FP64 service
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nathan-sovereign-supercomputer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app-factory/sovereign-hub/cloudflare/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix app-factory/sovereign-hub/cloudflare
      - run: node --test app-factory/nathan-ai/sovereign-supercomputer/runtime.test.mjs
      - run: python3 app-factory/nathan-ai/sovereign-supercomputer/nathan_ai_supercomputer.py run
      - name: Apply D1 migration and publish the Worker
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.NATHAN_SOVEREIGN_DEPLOY == 'true'
        working-directory: app-factory/nathan-ai/sovereign-supercomputer
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ../../sovereign-hub/cloudflare/node_modules/.bin/wrangler d1 migrations apply SOVEREIGN_DB --remote
          ../../sovereign-hub/cloudflare/node_modules/.bin/wrangler deploy --config wrangler.fabric.jsonc
          ../../sovereign-hub/cloudflare/node_modules/.bin/wrangler deploy --keep-vars

  live-qualification:
    name: Live FP64 qualification · seed ${{ matrix.seed }}
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.qualify_live)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        seed: ['0', '73', '2147483648', '4294967295']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Run one live job and independently replay its receipt
        env:
          TEST_SEED: ${{ matrix.seed }}
        run: |
          output="$RUNNER_TEMP/nathan-fp64-$TEST_SEED"
          mkdir -p "$output"
          curl --fail --silent --show-error --proto '=https' --max-time 25 --connect-timeout 8 \
            "https://nathan-ai-sovereign-core.nathantaboract.workers.dev/api/fp64/run?profile=fabric&seed=$TEST_SEED" \
            --output "$output/receipt.json"
          python3 app-factory/nathan-ai/sovereign-supercomputer/nathan_ai_supercomputer.py \
            verify "$output/receipt.json" > "$output/verified.json"
          python3 - "$output" "$TEST_SEED" <<'PYTHON'
          import json
          import sys
          from pathlib import Path

          output, seed = Path(sys.argv[1]), int(sys.argv[2])
          receipt = json.loads((output / "receipt.json").read_text())["receipt"]
          verified = json.loads((output / "verified.json").read_text())
          expected = {
              "verified": True, "profile": "fabric", "terms": 2097152,
              "shards": 16, "operations": 4194304, "comparable_hpl": False,
          }
          if receipt["seed"] != seed or any(verified.get(key) != value for key, value in expected.items()):
              raise SystemExit(f"Unexpected live receipt: {verified}")
          print(json.dumps({"seed": seed, **verified}, indent=2))
          PYTHON
