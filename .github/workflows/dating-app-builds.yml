name: Nathan AI Dating App Builds

on:
  push:
    paths:
      - 'app-factory/nathan-ai/dating-suite/**'
      - '.github/workflows/dating-app-builds.yml'
  pull_request:
    paths:
      - 'app-factory/nathan-ai/dating-suite/**'
      - '.github/workflows/dating-app-builds.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-factory/nathan-ai/dating-suite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test original Taters & Daters
        working-directory: app-factory/nathan-ai/dating-suite/ta-da
        run: node check.cjs
      - name: Test and package all three sites
        run: |
          node --test check.test.mjs
          node build.mjs "${RUNNER_TEMP}/dating-sites"
      - uses: actions/upload-artifact@v4
        with:
          name: dating-app-workers
          path: ${{ runner.temp }}/dating-sites/*.mjs
          if-no-files-found: error
