name: Persona Atlas Public Surface Audit
on:
  pull_request:
    paths:
      - "creative-archive/persona-duality/**"
      - ".github/workflows/persona-public-surface-audit.yml"
  push:
    branches: [main]
    paths:
      - "creative-archive/persona-duality/**"
      - ".github/workflows/persona-public-surface-audit.yml"
permissions:
  contents: read
jobs:
  public-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test creative-archive/persona-duality/public-surface-audit.test.mjs
