name: Nathan Tabor Mind · Conductor verification
on:
  push:
    paths:
      - 'app-factory/nathan-ai/minds-chat/**'
      - 'app-factory/tabor-academy/minds/**'
      - 'deployments/conductor/academy/nathan-tabor-mind.json'
      - '.github/workflows/nathan-tabor-mind.yml'
  workflow_dispatch:
    inputs:
      release:
        description: Expected deployed Git commit SHA
        required: true
        type: string
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test app-factory/tabor-academy/minds/minds.test.mjs
      - if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_RELEASE: ${{ inputs.release }}
        run: node app-factory/tabor-academy/minds/verify-live.mjs "$EXPECTED_RELEASE"
