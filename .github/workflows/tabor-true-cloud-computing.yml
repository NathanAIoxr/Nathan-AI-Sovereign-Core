name: Tabor True Cloud Computing
on:
  push:
    paths:
      - 'tabor-world/true-cloud-computing/**'
      - '.github/workflows/tabor-true-cloud-computing.yml'
  pull_request:
    paths:
      - 'tabor-world/true-cloud-computing/**'
      - '.github/workflows/tabor-true-cloud-computing.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Deploy the verified True Cloud Computing release
        type: boolean
        default: false
permissions:
  contents: read
defaults:
  run:
    working-directory: tabor-world/true-cloud-computing
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm test
      - run: npx --yes wrangler@4.164.0 deploy --dry-run
  deploy:
    if: github.ref_name == 'main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: true-cloud-computing-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
      - run: npx --yes wrangler@4.164.0 d1 execute DB --remote --file schema.sql
      - run: npx --yes wrangler@4.164.0 deploy
      - run: curl --fail --silent --show-error --retry 5 https://tabor-true-cloud-computing.nathantaboract.workers.dev/health
