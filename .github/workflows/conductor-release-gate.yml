name: Conductor Lasso Release Gate

on:
  pull_request:
    paths:
      - 'deployments/conductor/release-gate/**'
      - 'deployments/conductor/worker.mjs'
      - 'deployments/conductor/cheironomer/src/entry.js'
      - '.github/workflows/conductor-release-gate.yml'
  push:
    branches: [main]
    paths:
      - 'deployments/conductor/release-gate/**'
      - 'deployments/conductor/worker.mjs'
      - 'deployments/conductor/cheironomer/src/entry.js'
      - '.github/workflows/conductor-release-gate.yml'
  workflow_dispatch:
    inputs:
      release:
        description: GitHub source SHA reported by the live gate
        type: string
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --test deployments/conductor/release-gate/release-gate.test.mjs deployments/conductor/sovereign-minds/sovereign-minds.test.mjs
      - if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_RELEASE: ${{ inputs.release }}
        run: node deployments/conductor/release-gate/verify-live.mjs "$EXPECTED_RELEASE"
