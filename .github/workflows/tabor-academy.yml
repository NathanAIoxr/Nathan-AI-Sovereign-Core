name: Tabor Academy
on:
  push:
    branches: [zone/tabor-academy]
    paths:
      - app-factory/nathan-ai/tabor-academy/**
      - .github/workflows/tabor-academy.yml
  pull_request:
    paths:
      - app-factory/nathan-ai/tabor-academy/**
      - .github/workflows/tabor-academy.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-factory/nathan-ai/tabor-academy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm run build
      - run: node --check web/app.mjs
