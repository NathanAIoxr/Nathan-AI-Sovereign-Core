name: 'Zone · BEFORE THE STREETLIGHT: POSSOM HOLLAR ’83'
on:
  push:
    branches:
      - 'zone/possom-hollar-83'
    paths:
      - 'zones/isolated/possom-hollar-83/**'
      - '.github/workflows/zone-possom-hollar-83.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test zone.test.mjs
        working-directory: zones/isolated/possom-hollar-83
