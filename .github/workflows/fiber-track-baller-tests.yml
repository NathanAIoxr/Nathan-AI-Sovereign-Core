name: Fiber Track Baller tests
on:
  push:
    paths:
      - 'app-factory/nathan-ai/fiber-arts-track-baller/**'
      - '.github/workflows/fiber-track-baller-tests.yml'
  pull_request:
    paths:
      - 'app-factory/nathan-ai/fiber-arts-track-baller/**'
      - '.github/workflows/fiber-track-baller-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test simulated gesture mechanics
        working-directory: app-factory/nathan-ai/fiber-arts-track-baller
        run: node --test trackball.test.mjs pinch.test.mjs
