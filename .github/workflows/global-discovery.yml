name: Nathan AI Global Discovery - 20000 Candidate Index
on:
  workflow_dispatch:
  schedule:
    - cron: '43 */6 * * *'
permissions:
  contents: read
concurrency:
  group: nathan-ai-global-discovery
  cancel-in-progress: false
jobs:
  index-public-components:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Discover and ingest worldwide candidates in batches of 20
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_DISCOVERY_TOKEN: ${{ github.token }}
          CATALOG_DB_ID: 1889fb08-9b26-45b9-8a71-f22a6ee3fc66
          DISCOVERY_LIMIT: '20000'
        run: python3 integrations/unified-operations-cockpit/global-discovery.py
