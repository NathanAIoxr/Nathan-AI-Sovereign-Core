name: Complete repository checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository verification dependencies
        run: |
          python3 -m pip install -r app-factory/sovereign-hub/requirements.txt
          npm ci --prefix app-factory/sovereign-hub/cloudflare
      - name: Run all repository suites and bounded smoke checks
        run: python3 -B tools/release/check.py --out "$RUNNER_TEMP/repository-checks"
      - name: Build and verify the complete public site package
        run: |
          # Package the tested commit in a fresh worktree, isolated from test outputs.
          git worktree add --detach "$RUNNER_TEMP/repository-release-source" HEAD
          python3 -B "$RUNNER_TEMP/repository-release-source/tools/release/build.py" --out "$RUNNER_TEMP/repository-release"
          python3 -B tools/release/build.py --verify "$RUNNER_TEMP/repository-release/nathan-ai-site.zip"
      - name: Save check report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-checks
          path: ${{ runner.temp }}/repository-checks
          retention-days: 14

  web:
    name: Browser and mobile compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test runner
        run: |
          python3 -m pip install playwright==1.62.0
          python3 -m playwright install --with-deps chromium
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify the static engine module matches its game source
        run: |
          node app-factory/tabor-universal-library-engine/build.mjs
          git diff --exit-code -- app-factory/tabor-universal-library-engine/public/arcade-core.mjs
          node --test app-factory/tabor-universal-library-engine/library.test.mjs
      - name: Check web pages at phone, landscape, and desktop sizes
        run: python3 tools/release/web_compat.py --browser
