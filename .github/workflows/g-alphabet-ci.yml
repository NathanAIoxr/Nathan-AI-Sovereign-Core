name: G alphabet original titles, five-six glyphs and Tabor Spiral
on:
  pull_request:
    paths:
      - 'archive-index/alphabet/g/**'
      - 'archive-index/alphabet/directory.json'
      - 'archive-index/alphabet/directory.test.mjs'
      - 'archive-index/alphabet/letter-manifests.json'
      - 'app-factory/nathan-ai/hop-in/chatbox/engine.js'
      - 'app-factory/nathan-ai/hop-in/chatbox/engine.test.cjs'
      - '.github/workflows/g-alphabet-ci.yml'
  push:
    paths:
      - 'archive-index/alphabet/g/**'
      - 'archive-index/alphabet/directory.json'
      - 'archive-index/alphabet/letter-manifests.json'
      - '.github/workflows/g-alphabet-ci.yml'
jobs:
  g-source-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate full public G titles, original 5/6 geometry and dual spirals
        run: node --test archive-index/alphabet/g/g-core.test.mjs
      - name: Validate all 26 original letter departments
        run: node --test archive-index/alphabet/directory.test.mjs
      - name: Preserve earlier E and F work
        run: |
          node --test archive-index/alphabet/e/e-family.test.mjs archive-index/alphabet/e/e-word-families.test.mjs archive-index/alphabet/f/f-core.test.mjs
      - name: Confirm source-preserving HOP IN routes
        run: node --test app-factory/nathan-ai/hop-in/chatbox/engine.test.cjs
