name: BUDDY AI 🌀 — THE iCU ❤️ APP build

on:
  push:
    paths:
      - 'app-factory/nathan-ai/icu-buddy/**'
      - '.github/workflows/icu-buddy-build.yml'
  pull_request:
    paths:
      - 'app-factory/nathan-ai/icu-buddy/**'
      - '.github/workflows/icu-buddy-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-factory/nathan-ai/icu-buddy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test and package this application
        run: |
          node --test check.test.mjs
          node build.mjs "${RUNNER_TEMP}/icu-buddy"
      - uses: actions/upload-artifact@v4
        with:
          name: icu-buddy-worker
          path: |
            ${{ runner.temp }}/icu-buddy/icu-buddy.mjs
            app-factory/nathan-ai/icu-buddy/worker-metadata.json
          if-no-files-found: error
