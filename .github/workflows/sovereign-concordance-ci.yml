name: Sovereign concordance verification
on:
  workflow_dispatch:
  push:
    paths:
      - 'app-factory/nathan-ai/sovereign-concordance/**'
      - '.github/workflows/sovereign-concordance-ci.yml'
  pull_request:
    paths:
      - 'app-factory/nathan-ai/sovereign-concordance/**'
      - '.github/workflows/sovereign-concordance-ci.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test app-factory/nathan-ai/sovereign-concordance/worker.test.mjs
