name: Nathan AI Sovereign Compute Platform
on:
  pull_request:
    paths:
      - 'sovereign-ai-unit/**'
      - '.github/workflows/sovereign-compute-platform.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: sovereign-ai-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/platform.test.mjs
      - run: node --check tools/cli.mjs
      - run: node --check tools/benchmark.mjs
      - run: node --check tools/capacity.mjs
      - run: node --check tools/compare.mjs
