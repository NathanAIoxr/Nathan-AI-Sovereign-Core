name: Deploy Epenthesis Matrix Worker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tabor-world/word-rotations/linguistic-epenthesis-engine/**'
      - '.github/workflows/deploy-epenthesis-matrix.yml'
jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tabor-world/word-rotations/linguistic-epenthesis-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic tests
        run: node --test test.mjs
      - name: Deploy to Cloudflare
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: tabor-world/word-rotations/linguistic-epenthesis-engine
          command: deploy
