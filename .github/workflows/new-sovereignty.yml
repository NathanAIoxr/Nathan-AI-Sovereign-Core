name: New Sovereignty
on:
  push:
    branches: [zone/new-sovereignty]
    paths:
      - 'app-factory/nathan-ai/new-sovereignty/**'
      - '.github/workflows/new-sovereignty.yml'
  pull_request:
    paths:
      - 'app-factory/nathan-ai/new-sovereignty/**'
      - '.github/workflows/new-sovereignty.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test app-factory/nathan-ai/new-sovereignty/test/*.test.mjs
