name: Nathan Tabor Assessment Studio
on:
  push:
    paths:
      - 'app-factory/nathan-ai/assessment-studio/**'
      - '.github/workflows/nathan-tabor-assessment-studio.yml'
  pull_request:
    paths:
      - 'app-factory/nathan-ai/assessment-studio/**'
      - '.github/workflows/nathan-tabor-assessment-studio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-factory/nathan-ai/assessment-studio
    outputs:
      release: ${{ steps.build.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test check.test.mjs
      - name: Build Worker
        id: build
        run: |
          release=$(node build.mjs "$RUNNER_TEMP/assessment-studio")
          echo "release=$release" >> "$GITHUB_OUTPUT"
          cp worker-metadata.json "$RUNNER_TEMP/assessment-studio/"
      - uses: actions/upload-artifact@v4
        with:
          name: nathan-tabor-assessment-studio
          path: ${{ runner.temp }}/assessment-studio
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    concurrency: nathan-tabor-assessment-studio-production
    env:
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'a70580bacdf96c946662b7b67dcb45b5' }}
      CF_WORKER_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      BUILD_RELEASE: ${{ needs.build.outputs.release }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nathan-tabor-assessment-studio
      - name: Publish and verify the dedicated Worker
        if: env.CF_WORKER_TOKEN != ''
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/dispatch/namespaces/nathan-tabor-platforms/scripts/nathan-tabor-assessment-studio"
          curl --fail-with-body --silent --show-error --max-time 45 -X PUT \
            -H "Authorization: Bearer $CF_WORKER_TOKEN" \
            -F 'metadata=@worker-metadata.json;type=application/json' \
            -F 'worker.mjs=@nathan-tabor-assessment-studio.mjs;type=application/javascript+module' "$endpoint" |
            jq -e '.success == true' > /dev/null
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 15 'https://unified-operations-cockpit.nathantaboract.workers.dev/tabor-apps/assessment-studio/healthz' |
              jq -e --arg release "$BUILD_RELEASE" '.ok and .release == $release' > /dev/null; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Report skipped deployment
        if: env.CF_WORKER_TOKEN == ''
        run: echo "Cloudflare redeployment requires the repository's Worker API token." >> "$GITHUB_STEP_SUMMARY"
