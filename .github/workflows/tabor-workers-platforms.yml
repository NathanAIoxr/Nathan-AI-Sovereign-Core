name: Nathan Tabor Workers for Platforms

on:
  pull_request:
    paths:
      - 'workers-platforms/**'
      - '.github/workflows/tabor-workers-platforms.yml'
  workflow_dispatch:
    inputs:
      target:
        description: Deploy one hub or platform ID
        required: true
        type: choice
        options:
          - hub
          - languages
          - wordplay
          - compute
          - memory
          - cloud
          - bitcoin
          - moment
          - outside-box
          - world
          - library
          - github

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node --test workers-platforms/dispatch.test.mjs

  release:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: tabor-platforms-${{ inputs.target }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - env:
          TARGET: ${{ inputs.target }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node workers-platforms/deploy.mjs "$TARGET"
