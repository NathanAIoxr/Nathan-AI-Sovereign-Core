name: Orchestration Worker - deploy and backup
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/orchestration/**'
      - '.github/workflows/deploy.yml'
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: orchestration-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare/orchestration
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.NATHAN_ORCHESTRATION_D1_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Validate configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$D1_DATABASE_ID"
          node --check src/index.js
          node -e "const fs=require('fs');const p='wrangler.toml';const s=fs.readFileSync(p,'utf8');fs.writeFileSync(p,s.replace('REPLACE_WITH_EXISTING_D1_DATABASE_ID',process.env.D1_DATABASE_ID))"
      - name: Apply D1 migrations first
        run: npx wrangler d1 migrations apply nathan-ai-orchestration --remote --config wrangler.toml
      - name: Deploy isolated Worker
        run: npx wrangler deploy --config wrangler.toml
  backup:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare/orchestration
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.NATHAN_ORCHESTRATION_D1_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Verify configuration and export backup
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$D1_DATABASE_ID"
          node -e "const fs=require('fs');const p='wrangler.toml';fs.writeFileSync(p,fs.readFileSync(p,'utf8').replace('REPLACE_WITH_EXISTING_D1_DATABASE_ID',process.env.D1_DATABASE_ID))"
          npx wrangler d1 export nathan-ai-orchestration --remote --config wrangler.toml --output=orchestration-backup.sql
      - uses: actions/upload-artifact@v4
        with:
          name: orchestration-d1-backup-${{ github.run_id }}
          path: cloudflare/orchestration/orchestration-backup.sql
          retention-days: 7
          if-no-files-found: error
