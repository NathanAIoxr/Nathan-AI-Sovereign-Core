name: Conductor Zone TIME
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deployments/conductor/zone-sandbox/**'
      - '.github/workflows/conductor-zone-time.yml'

concurrency:
  group: conductor-zone-time
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rehearsal:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate Zone manifests and test the holding Worker
        run: |
          node --test deployments/conductor/zone-sandbox/*.test.mjs
          node deployments/conductor/zone-sandbox/run.mjs --validate
      - name: Reconcile private rehearsal resources
        run: node deployments/conductor/zone-sandbox/run.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
