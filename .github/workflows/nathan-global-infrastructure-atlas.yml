name: Nathan AI Global Infrastructure Atlas audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app-factory/nathan-ai/global-infrastructure-atlas/**'
      - '.github/workflows/nathan-global-infrastructure-atlas.yml'
  schedule:
    - cron: '31 * * * *'
permissions:
  contents: read
concurrency:
  group: nathan-global-atlas
  cancel-in-progress: false
jobs:
  verify-public-reference-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify atlas endpoints and layer integrity
        run: node --test app-factory/nathan-ai/global-infrastructure-atlas/index.test.mjs
      - name: Verify the live public archive
        env:
          ATLAS_URL: https://nathan-ai-global-infrastructure-atlas.nathantaboract.workers.dev
          ARCHIVE_DIR: app-factory/nathan-ai/global-infrastructure-atlas/archive
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 "$ATLAS_URL/api/archive/summary" \
            | node -e 'const data = JSON.parse(require("node:fs").readFileSync(0, "utf8")); if (data.counts?.components < 871 || data.counts?.layers !== 18) process.exit(1);'
          curl --fail --silent --show-error --max-time 20 "$ATLAS_URL/archive/download" \
            | cmp - "$ARCHIVE_DIR/whole_global_computing_network_atlas.zip"
          curl --fail --silent --show-error --max-time 20 "$ATLAS_URL/archive/discovery-v1.zip" \
            | cmp - "$ARCHIVE_DIR/global_tech_discovery_bundle-v1.zip"
          curl --fail --silent --show-error --max-time 20 "$ATLAS_URL/archive/discovery-v2.zip" \
            | cmp - "$ARCHIVE_DIR/global_tech_discovery_bundle-v2.zip"
          status=$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' --request POST "$ATLAS_URL/archive/download")
          test "$status" = 405
      - name: Write bounded audit receipt
        run: |
          node --input-type=module -e "import{LAYERS,COMPONENTS,EDGES,SOURCES}from './app-factory/nathan-ai/global-infrastructure-atlas/index.mjs';import{writeFileSync}from'node:fs';writeFileSync(process.env.RUNNER_TEMP+'/atlas-receipt.json',JSON.stringify({timestamp:new Date().toISOString(),layers:LAYERS.length,seed_components:COMPONENTS.length,edges:EDGES.length,sources:SOURCES.length,scope:'public_architectural_reference_only',remotely_installed:0},null,2))"
      - uses: actions/upload-artifact@v4
        with:
          name: global-atlas-audit
          path: ${{ runner.temp }}/atlas-receipt.json
          retention-days: 7
