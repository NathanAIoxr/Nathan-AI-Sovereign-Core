name: Deploy Sovereign Edge OS

on:
  pull_request:
    paths: [digital-edge-101/**, workers-platforms/act-seed.mjs, .github/workflows/digital-edge-os.yml]
  push:
    branches: [main]
    paths: [digital-edge-101/**, workers-platforms/act-seed.mjs, .github/workflows/digital-edge-os.yml]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: digital-edge-os-${{ github.ref }}
jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: digital-edge-101
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: digital-edge-101/package-lock.json
      - run: rustup target add wasm32-unknown-unknown
      - run: npm ci
      - run: npm run generate && git diff --exit-code
      - run: npm run typecheck && npm test && npm run build
      - name: Deploy verified build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
