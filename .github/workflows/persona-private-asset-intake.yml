name: Persona Private Asset Intake CI
on:
  push:
    paths:
      - "creative-archive/persona-duality/private-asset-intake/**"
      - ".github/workflows/persona-private-asset-intake.yml"
  pull_request:
    paths:
      - "creative-archive/persona-duality/private-asset-intake/**"
      - ".github/workflows/persona-private-asset-intake.yml"
permissions:
  contents: read
jobs:
  private-metadata-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test creative-archive/persona-duality/private-asset-intake/intake.test.mjs
