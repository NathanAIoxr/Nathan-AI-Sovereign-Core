name: One-time CI integrity repair (safe author-original preservation)
on:
  push:
    branches:
      - repair/ci-zeros-ones-20261113
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair shared integration, missing published assets, and hash-pinned notice ledger
        run: python3 -B tools/ci-repair/repair.py
      - name: Verify the originally failing suites before committing
        run: |
          node --test app-factory/nathan-ai/appearance/engine.test.cjs
          node --test app-factory/nathan-ai/launcher/engine.test.cjs
          python3 -m unittest discover -s tools/record-notice -p test_update.py -v
          python3 -m unittest discover -s tools/release -p test_build.py -v
      - name: Commit mechanical repairs only to dedicated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "Repair CI page integrations, notices and packaged links without changing archived originals"
            git push origin HEAD:repair/ci-zeros-ones-20261113
          fi
