name: Tabor Academy Card Games

on:
  pull_request:
    paths:
      - 'app-factory/tabor-academy/card-games/**'
      - 'deployments/conductor/academy/card-games.json'
      - '.github/workflows/tabor-academy-card-games.yml'
  push:
    branches: [main]
    paths:
      - 'app-factory/tabor-academy/card-games/**'
      - 'deployments/conductor/academy/card-games.json'
      - '.github/workflows/tabor-academy-card-games.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: app-factory/tabor-academy/card-games

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm test

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'NathanAIoxr/Nathan-AI-Sovereign-Core'
    needs: check
    runs-on: ubuntu-latest
    concurrency:
      group: tabor-academy-card-games-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm run deploy
      - run: npm run verify
