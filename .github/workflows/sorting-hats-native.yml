name: Sorting Hats & Hatettes native builds
on:
  push:
    branches: [main]
    paths:
      - 'app-factory/nathan-ai/sorting-hats-hatettes/native/**'
      - 'app-factory/nathan-ai/sorting-hats-hatettes/public/**'
      - '.github/workflows/sorting-hats-native.yml'
  pull_request:
    paths:
      - 'app-factory/nathan-ai/sorting-hats-hatettes/native/**'
      - 'app-factory/nathan-ai/sorting-hats-hatettes/public/**'
      - '.github/workflows/sorting-hats-native.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'
permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test app-factory/nathan-ai/sorting-hats-hatettes/game.test.mjs
      - run: node app-factory/nathan-ai/sorting-hats-hatettes/native/pack-data.mjs

  ios:
    needs: catalog
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare the native catalog and icon
        working-directory: app-factory/nathan-ai/sorting-hats-hatettes/native
        run: |
          node pack-data.mjs
          icon=ios/Resources/Assets.xcassets/AppIcon.appiconset
          mkdir -p "$icon"
          printf '%s\n' '{"info":{"author":"xcode","version":1}}' > ios/Resources/Assets.xcassets/Contents.json
          printf '%s\n' '{"images":[{"filename":"AppIcon.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > "$icon/Contents.json"
          sips -z 1024 1024 ../public/icon-512.png --out "$icon/AppIcon.png"
      - name: Compile native iPhone build with Xcode
        working-directory: app-factory/nathan-ai/sorting-hats-hatettes/native/ios
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          brew install xcodegen
          xcodegen generate
          xcodebuild -project SortingHatsUnbound.xcodeproj -scheme SortingHatsUnbound \
            -configuration Release -destination 'generic/platform=iOS' -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          mkdir -p Payload "${RUNNER_TEMP}/unbound-ios"
          cp -R .build/Build/Products/Release-iphoneos/SortingHatsUnbound.app Payload/
          test -f Payload/SortingHatsUnbound.app/realms.json
          zip -qry "${RUNNER_TEMP}/unbound-ios/UNBOUND-iOS-Unsigned.ipa" Payload
          unzip -tq "${RUNNER_TEMP}/unbound-ios/UNBOUND-iOS-Unsigned.ipa"
          xcodebuild -version > "${RUNNER_TEMP}/unbound-ios/xcode.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: UNBOUND-iOS-Unsigned
          path: ${{ runner.temp }}/unbound-ios/
          if-no-files-found: error

  android:
    needs: catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile Android app bundle and debug APK
        working-directory: app-factory/nathan-ai/sorting-hats-hatettes/native
        run: |
          node pack-data.mjs
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdk_manager="$(find "$sdk_root/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          test -x "$sdk_manager"
          "$sdk_manager" --sdk_root="$sdk_root" "platforms;android-36" "build-tools;35.0.0"
          gradle -p android --no-daemon :app:lintRelease :app:bundleRelease :app:assembleDebug
          mkdir -p "${RUNNER_TEMP}/unbound-android"
          cp android/app/build/outputs/bundle/release/app-release.aab "${RUNNER_TEMP}/unbound-android/UNBOUND-Android-Unsigned.aab"
          cp android/app/build/outputs/apk/debug/app-debug.apk "${RUNNER_TEMP}/unbound-android/UNBOUND-Android-Debug.apk"
          unzip -tq "${RUNNER_TEMP}/unbound-android/UNBOUND-Android-Unsigned.aab"
          unzip -tq "${RUNNER_TEMP}/unbound-android/UNBOUND-Android-Debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: UNBOUND-Android-Test-Artifacts
          path: ${{ runner.temp }}/unbound-android/
          if-no-files-found: error
