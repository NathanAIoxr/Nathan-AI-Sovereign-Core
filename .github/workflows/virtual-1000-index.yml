name: Verify independent 1000-slot app, book and technology indexes

on:
  pull_request:
    paths:
      - 'app-factory/portfolio/supercomputer-slots-1000/**'
      - '.github/workflows/virtual-1000-index.yml'
  push:
    branches: [main]
    paths:
      - 'app-factory/portfolio/supercomputer-slots-1000/**'
      - '.github/workflows/virtual-1000-index.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify 1000 logical slot indexes and repeatable SQLite migration
        run: python3 app-factory/portfolio/supercomputer-slots-1000/verify.py
