name: Tabor Academy Institution

on:
  pull_request:
    paths:
      - 'app-factory/tabor-academy/institution/**'
      - 'deployments/conductor/academy/architecture.json'
      - '.github/workflows/tabor-academy-institution.yml'
  push:
    branches: [main]
    paths:
      - 'app-factory/tabor-academy/institution/**'
      - 'deployments/conductor/academy/architecture.json'
      - '.github/workflows/tabor-academy-institution.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: app-factory/tabor-academy/institution

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --test test.mjs

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'NathanAIoxr/Nathan-AI-Sovereign-Core'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: tabor-academy-institution-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Publish to Cloudflare
        if: env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_API_TOKEN != ''
        run: node deploy.mjs
      - name: Report missing deployment credentials
        if: env.CLOUDFLARE_ACCOUNT_ID == '' || env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Deployment secrets are absent. Verifying the current Cloudflare release."
      - name: Verify live release
        run: node verify.mjs
