name: ONE - River and Spark Master Compilation Integrity
on:
  push:
    paths:
      - 'app-factory/nathan-ai/personal-intelligence/minds/federation/river-spark-master-v1/**'
      - 'app-factory/nathan-ai/personal-intelligence/minds/federation/continuity-v496/**'
      - 'app-factory/nathan-ai/personal-intelligence/minds/federation/technology-v108/**'
      - 'app-factory/nathan-ai/personal-intelligence/minds/federation/fencepost-error-syndrome/root13-workers.json'
      - 'app-factory/nathan-ai/personal-intelligence/minds/federation/federation.py'
      - '.github/workflows/one-river-spark-master.yml'
  pull_request:
    paths:
      - 'app-factory/nathan-ai/personal-intelligence/minds/federation/river-spark-master-v1/**'
      - 'app-factory/nathan-ai/personal-intelligence/minds/federation/continuity-v496/**'
      - 'app-factory/nathan-ai/personal-intelligence/minds/federation/technology-v108/**'
      - 'app-factory/nathan-ai/personal-intelligence/minds/federation/fencepost-error-syndrome/root13-workers.json'
      - 'app-factory/nathan-ai/personal-intelligence/minds/federation/federation.py'
      - '.github/workflows/one-river-spark-master.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-compilation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify 246 / 7 / 14 / 114 / 108 / 333 / 496 and source distinctions
        run: |
          F=app-factory/nathan-ai/personal-intelligence/minds/federation
          python3 -m unittest discover -s "$F/river-spark-master-v1" -p 'test_master.py' -v
          python3 "$F/river-spark-master-v1/validate_master.py" > /tmp/river-spark-evidence.json
          cat /tmp/river-spark-evidence.json
      - name: Ingest independently namespaced materials into disposable ONE Federation
        run: |
          F=app-factory/nathan-ai/personal-intelligence/minds/federation
          DB=/tmp/ONE_Federation_RiverSpark_test.sqlite3
          python3 "$F/federation.py" --db "$DB" ingest "$F/river-spark-master-v1/knowledge_pack.v074.json"
          python3 "$F/federation.py" --db "$DB" ingest "$F/technology-v108/registry.tech108.json"
          python3 "$F/federation.py" --db "$DB" ingest "$F/continuity-v496/registry.v496.json"
          python3 "$F/federation.py" --db "$DB" ingest "$F/fencepost-error-syndrome/root13-workers.json"
          python3 "$F/federation.py" --db "$DB" status
          python3 -c 'import sqlite3; c=sqlite3.connect("/tmp/ONE_Federation_RiverSpark_test.sqlite3"); assert c.execute("SELECT COUNT(*) FROM federation_records").fetchone()[0] == 479; assert c.execute("SELECT COUNT(*) FROM federation_links WHERE relation IS NOT NULL").fetchone()[0] == 27; assert c.execute("PRAGMA quick_check").fetchone()[0] == "ok"; c.close()'
      - name: Publish source-safe synthesis verification
        uses: actions/upload-artifact@v4
        with:
          name: river-spark-master-evidence
          path: /tmp/river-spark-evidence.json
          if-no-files-found: error
