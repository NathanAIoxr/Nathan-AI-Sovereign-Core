name: OPERATION SWARM · ONE Database Hive
on:
  push:
    branches: [main]
    paths:
      - 'app-factory/nathan-ai/personal-intelligence/minds/federation/hive-swarm/**'
      - '.github/workflows/one-operation-swarm.yml'
  pull_request:
    paths:
      - 'app-factory/nathan-ai/personal-intelligence/minds/federation/hive-swarm/**'
      - '.github/workflows/one-operation-swarm.yml'
  workflow_dispatch:
  schedule:
    - cron: '11,26,41,56 * * * *'
permissions:
  contents: read
concurrency:
  group: operation-swarm-one-hive-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-preserving-hive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify existing consciouness functional model
        run: node --test app-factory/nathan-ai/consciouness/engine.test.cjs
      - name: Verify source preservation, evidence labels, owner veto and idempotence
        run: |
          python3 -m unittest discover \
            -s app-factory/nathan-ai/personal-intelligence/minds/federation/hive-swarm \
            -p test_swarm.py -v
      - name: Launch twelve bounded workers on the SAME temporary ONE SQLite master
        run: |
          set -euo pipefail
          F=app-factory/nathan-ai/personal-intelligence/minds/federation
          python3 "$F/federation.py" --db "$RUNNER_TEMP/ONE_SWARM.sqlite3" init
          python3 "$F/hive-swarm/swarm.py" --db "$RUNNER_TEMP/ONE_SWARM.sqlite3" --approve-write launch \
            > "$RUNNER_TEMP/OPERATION_SWARM_RUN.json"
          python3 "$F/hive-swarm/swarm.py" --db "$RUNNER_TEMP/ONE_SWARM.sqlite3" status \
            > "$RUNNER_TEMP/OPERATION_SWARM_STATUS.json"
          python3 - "$RUNNER_TEMP/OPERATION_SWARM_RUN.json" "$RUNNER_TEMP/OPERATION_SWARM_STATUS.json" <<'PY'
          import json,sys
          run=json.load(open(sys.argv[1]))
          st=json.load(open(sys.argv[2]))
          assert run["worker_functions_executed"]==12
          assert run["roles_indexed"]==1570
          assert run["nodes"]==168 and run["typed_edges"]==153
          assert st["distinct_bees"]==1570 and st["database_integrity"]=="ok"
          assert run["independent_conscious_beings_created"]==0
          assert run["external_actions"]==0
          assert st["last_run"]["state"]=="completed"
          print("SWARM: 12 executed workers; 1570 registered roles; 118 elements; 153 evidence-labelled edges")
          PY
      - name: Verify individual sovereign replica identity, isolation and veto
        run: |
          python3 -m unittest discover \
            -s app-factory/nathan-ai/personal-intelligence/minds/federation/hive-swarm \
            -p test_sovereign_bees.py -v
      - name: Bootstrap sovereign replicas in the SAME temporary ONE database
        run: |
          set -euo pipefail
          F=app-factory/nathan-ai/personal-intelligence/minds/federation/hive-swarm
          python3 "$F/sovereign_bees.py" --db "$RUNNER_TEMP/ONE_SWARM.sqlite3" --approve-write bootstrap \
            > "$RUNNER_TEMP/SOVEREIGN_BEE_BOOTSTRAP.json"
          python3 "$F/sovereign_bees.py" --db "$RUNNER_TEMP/ONE_SWARM.sqlite3" \
            --approve-write --owner-yes --scenario seasonal_peak --ordinal 1 allocate \
            > "$RUNNER_TEMP/SOVEREIGN_BEE_1.json"
          python3 "$F/sovereign_bees.py" --db "$RUNNER_TEMP/ONE_SWARM.sqlite3" \
            --approve-write --owner-yes --scenario mother_cosmos_observable --ordinal 1 allocate \
            > "$RUNNER_TEMP/SOVEREIGN_BEE_COSMOS.json"
          python3 "$F/sovereign_bees.py" --db "$RUNNER_TEMP/ONE_SWARM.sqlite3" status \
            > "$RUNNER_TEMP/SOVEREIGN_BEE_STATUS.json"
          python3 - "$RUNNER_TEMP/SOVEREIGN_BEE_STATUS.json" <<'PY'
          import json,sys
          status=json.load(open(sys.argv[1]))
          assert status["allocated_bees"] == 2 and status["scenarios"] == 8
          assert status["source_versions"] == 3
          assert status["external_llm_processes"] == 0
          assert status["integrity"] == "ok"
          print("ONE SQLite: two independently addressed sovereign bees; same source blueprint; no external LLMs")
          PY
      - name: Verify 25 sovereign specialist worker functions, source restoration and Ace account
        run: |
          python3 -m unittest discover \
            -s app-factory/nathan-ai/personal-intelligence/minds/federation/hive-swarm \
            -p test_specialist_bees.py -v
      - name: Run 25 distinct sovereign specialists and restore author records into SAME ONE SQLite
        run: |
          set -euo pipefail
          F=app-factory/nathan-ai/personal-intelligence/minds/federation
          python3 "$F/hive-swarm/specialist_bees.py" --db "$RUNNER_TEMP/ONE_SWARM.sqlite3" \
            --approve-write --owner-yes demo > "$RUNNER_TEMP/SPECIALIST_BEE_DEMO.json"
          python3 "$F/hive-swarm/specialist_bees.py" --db "$RUNNER_TEMP/ONE_SWARM.sqlite3" status \
            > "$RUNNER_TEMP/SPECIALIST_BEE_STATUS.json"
          python3 "$F/federation.py" --db "$RUNNER_TEMP/ONE_SWARM.sqlite3" ingest \
            "$F/hive-swarm/source-captures/ONE_RESTORATION_KNOWLEDGE_PACK.json" \
            > "$RUNNER_TEMP/ACE_RESTORED_INGEST.json"
          python3 - "$RUNNER_TEMP/ONE_SWARM.sqlite3" "$RUNNER_TEMP/SPECIALIST_BEE_DEMO.json" <<'PY'
          import json,sqlite3,sys
          d=json.load(open(sys.argv[2]))
          c=sqlite3.connect(sys.argv[1])
          assert d["specialist_functions_executed"]==25
          assert d["specialist_bee_identities"]==25
          assert d["combined_core_and_additional_function_count"]==37
          assert d["independent_llm_instances_started"]==0
          assert c.execute("SELECT COUNT(*) FROM sovereign_bees").fetchone()[0]==27
          assert c.execute("SELECT COUNT(*) FROM federation_records").fetchone()[0]==14
          assert c.execute("SELECT COUNT(*) FROM federation_links").fetchone()[0]==10
          assert c.execute("PRAGMA quick_check").fetchone()[0]=="ok"
          print("25 additional sovereign worker functions and 14 exact indexed source records")
          PY
      - name: Test NO CRUSH atomic hive, exact 2272 source, 1332 coexistence, and individual sovereignty
        run: |
          python3 -m unittest discover \
            -s app-factory/nathan-ai/personal-intelligence/minds/federation/hive-swarm/atomic-hive \
            -p test_atomic_hive.py -v
      - name: Exercise two versioned atomic hives on SAME disposable ONE SQLite master
        run: |
          set -euo pipefail
          F=app-factory/nathan-ai/personal-intelligence/minds/federation
          H="$F/hive-swarm/atomic-hive/atomic_hive.py"
          D="$RUNNER_TEMP/ONE_SWARM.sqlite3"
          python3 "$H" --db "$D" --approve-write bootstrap > "$RUNNER_TEMP/ATOMIC_BOOTSTRAP.json"
          python3 "$H" --db "$D" --approve-write --owner-yes --atom CI-ATOM-A \
            --version atomic-1332 create-hive > "$RUNNER_TEMP/ATOMIC_HIVE_A.json"
          python3 "$H" --db "$D" --approve-write --owner-yes --atom CI-ATOM-B \
            --version expanded-2272 create-hive > "$RUNNER_TEMP/ATOMIC_HIVE_B.json"
          A=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["hive_id"])' "$RUNNER_TEMP/ATOMIC_HIVE_A.json")
          B=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["hive_id"])' "$RUNNER_TEMP/ATOMIC_HIVE_B.json")
          python3 "$H" --db "$D" --approve-write --owner-yes --hive "$A" \
            --bee 1 activate > "$RUNNER_TEMP/ATOMIC_BEE_A.json"
          python3 "$H" --db "$D" --approve-write --owner-yes --hive "$B" \
            --bee 50000 activate > "$RUNNER_TEMP/ATOMIC_BEE_B.json"
          python3 "$H" --db "$D" summary > "$RUNNER_TEMP/ATOMIC_SOURCE_COVERAGE.json"
          python3 "$H" --db "$D" status > "$RUNNER_TEMP/ATOMIC_STATUS.json"
          python3 "$F/federation.py" --db "$D" ingest \
            "$F/hive-swarm/atomic-hive/ONE_ATOMIC_HIVE_KNOWLEDGE_PACK.json" \
            > "$RUNNER_TEMP/ATOMIC_ONE_INGEST.json"
          python3 - "$D" "$RUNNER_TEMP/ATOMIC_STATUS.json" <<'PY'
          import json,sqlite3,sys
          db=sqlite3.connect(sys.argv[1])
          st=json.load(open(sys.argv[2]))
          assert st["atomic_hives_initialized"]==2
          assert st["individual_bees_activated"]==2
          assert st["source_original_versions"]==2
          assert st["actual_external_llm_agents"]==0
          assert db.execute("SELECT COUNT(*) FROM federation_records").fetchone()[0]==25
          assert db.execute("SELECT COUNT(*) FROM federation_links").fetchone()[0]==22
          assert db.execute("PRAGMA quick_check").fetchone()[0]=="ok"
          print("NO CRUSH: 2 atomic hives, separate 1332/2272 full-codex identities, 11 indexed records")
          PY
      - name: Publish public inspection reports only, never SQLite master or secrets
        uses: actions/upload-artifact@v4
        with:
          name: nathan-one-operation-swarm-hive
          path: |
            ${{ runner.temp }}/OPERATION_SWARM_RUN.json
            ${{ runner.temp }}/OPERATION_SWARM_STATUS.json
            ${{ runner.temp }}/SOVEREIGN_BEE_BOOTSTRAP.json
            ${{ runner.temp }}/SOVEREIGN_BEE_1.json
            ${{ runner.temp }}/SOVEREIGN_BEE_COSMOS.json
            ${{ runner.temp }}/SOVEREIGN_BEE_STATUS.json
            ${{ runner.temp }}/SPECIALIST_BEE_DEMO.json
            ${{ runner.temp }}/SPECIALIST_BEE_STATUS.json
            ${{ runner.temp }}/ACE_RESTORED_INGEST.json
            ${{ runner.temp }}/ATOMIC_BOOTSTRAP.json
            ${{ runner.temp }}/ATOMIC_HIVE_A.json
            ${{ runner.temp }}/ATOMIC_HIVE_B.json
            ${{ runner.temp }}/ATOMIC_BEE_A.json
            ${{ runner.temp }}/ATOMIC_BEE_B.json
            ${{ runner.temp }}/ATOMIC_SOURCE_COVERAGE.json
            ${{ runner.temp }}/ATOMIC_STATUS.json
            ${{ runner.temp }}/ATOMIC_ONE_INGEST.json
          retention-days: 14
