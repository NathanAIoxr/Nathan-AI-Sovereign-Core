name: Nathan AI Global Bounties

on:
  pull_request:
    paths:
      - 'app-factory/nathan-ai/global-bounties/**'
      - '.github/workflows/nathan-global-bounties.yml'
  push:
    branches: [main]
    paths:
      - 'app-factory/nathan-ai/global-bounties/**'
      - '.github/workflows/nathan-global-bounties.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: app-factory/nathan-ai/global-bounties

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm test

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: nathan-global-bounties-production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm run build
      - name: Deploy the independent namespace Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.135.0 deploy --dispatch-namespace nathan-tabor-platforms
      - name: Verify the public catalog
        run: curl --fail --silent --show-error --retry 3 https://tabor-bridge.nathantaboract.workers.dev/global-bounties/stats
