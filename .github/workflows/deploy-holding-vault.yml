name: Deploy holding vault
on:
  pull_request:
    paths: ['zones/holding-vault/**', '.github/workflows/deploy-holding-vault.yml']
  push:
    branches: [main]
    paths: ['zones/holding-vault/**', '.github/workflows/deploy-holding-vault.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: holding-vault-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test zones/holding-vault/holding-gate.test.mjs
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    needs: test
    defaults:
      run:
        working-directory: zones/holding-vault
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply D1 migrations
        run: npx --yes wrangler@4.165.0 d1 migrations apply tabor-holding-vault --remote
      - name: Upload to Workers for Platforms
        run: npx --yes wrangler@4.165.0 deploy --dispatch-namespace nathan-tabor-platforms --keep-vars
      - name: Check the gate
        run: |
          base=https://tabor-bridge.nathantaboract.workers.dev/holding-vault
          curl -fsS --retry 3 "$base/health" | jq -e '.service == "tabor-holding-vault" and .status == "ok"'
          code="$(curl -sS -o /dev/null -w '%{http_code}' "$base/preview")"
          case "$code" in 302|303|307|401|403) ;; *) exit 1 ;; esac
