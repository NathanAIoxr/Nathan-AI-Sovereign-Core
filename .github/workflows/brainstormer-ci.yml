name: Brainstormer Sovereign Editions
on:
  push:
    paths:
      - 'app-factory/nathan-ai/brainstormer/**'
      - 'archive-index/brainstormer/**'
      - 'app-factory/nathan-ai/hop-in/chatbox/**'
      - '.github/workflows/brainstormer-ci.yml'
  pull_request:
    paths:
      - 'app-factory/nathan-ai/brainstormer/**'
      - 'archive-index/brainstormer/**'
      - 'app-factory/nathan-ai/hop-in/chatbox/**'
      - '.github/workflows/brainstormer-ci.yml'
jobs:
  source-and-functionality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test app-factory/nathan-ai/brainstormer/editions.test.cjs app-factory/nathan-ai/hop-in/chatbox/engine.test.cjs
      - run: python -m py_compile app-factory/nathan-ai/brainstormer/originals/NathanAI_Brainstormer_Python_v002.py
