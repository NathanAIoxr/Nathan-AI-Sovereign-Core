name: Persona Authorship Boundaries
on:
  pull_request:
    paths:
      - "creative-archive/persona-duality/**"
      - ".github/workflows/persona-authorship-boundaries.yml"
  push:
    paths:
      - "creative-archive/persona-duality/**"
      - ".github/workflows/persona-authorship-boundaries.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test creative-archive/persona-duality/worker.test.mjs creative-archive/persona-duality/authorship-boundaries.test.mjs
