name: Octopus Mirror Engine validation
on:
  push:
    paths:
      - 'app-factory/nathan-ai/octopus-mirror-engine/**'
      - '.github/workflows/octopus-mirror-engine-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check app-factory/nathan-ai/octopus-mirror-engine/src/engine.mjs
          node --check app-factory/nathan-ai/octopus-mirror-engine/src/conductor-adapter.mjs
          node --check app-factory/nathan-ai/octopus-mirror-engine/worker.mjs
      - name: Execute offline deterministic tests
        run: node --test app-factory/nathan-ai/octopus-mirror-engine/test/engine.test.mjs
