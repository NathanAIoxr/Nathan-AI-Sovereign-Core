name: Sovereignty OS duality verification
on:
  workflow_dispatch:
  push:
    paths:
      - 'projects/sovereignty-os/duality/**'
      - '.github/workflows/sovereignty-os-duality.yml'
  schedule:
    - cron: '41 */6 * * *'
permissions:
  contents: read
jobs:
  it-test-angel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify role assignments and arithmetic
        run: python3 projects/sovereignty-os/duality/verify.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify runtime profiles and sandbox fixtures
        run: |
          node --test projects/sovereignty-os/duality/runtime/runtime.test.mjs
          node projects/sovereignty-os/duality/runtime/select.mjs inventory > "$RUNNER_TEMP/nathan-runtime-inventory.json"
