name: TaborPoolBoys
on:
  pull_request:
    paths:
      - 'standalone-apps/taborpoolboys/**'
      - 'standalone-apps/magazine-runtime.mjs'
      - '.github/workflows/taborpoolboys.yml'
  push:
    branches: [main]
    paths:
      - 'standalone-apps/taborpoolboys/**'
      - 'standalone-apps/magazine-runtime.mjs'
      - '.github/workflows/taborpoolboys.yml'
  workflow_dispatch:
  schedule:
    - cron: '53 */6 * * *'
permissions:
  contents: read
defaults:
  run:
    working-directory: standalone-apps/taborpoolboys
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: taborpoolboys-site
          path: standalone-apps/taborpoolboys/build/site
  verify-live:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check live magazine
        working-directory: .
        shell: bash
        run: |
          set -eo pipefail
          curl --fail --silent --show-error --retry 3 --max-time 15 https://pub-2df43f63514844ecbcd9f7da4de75d89.r2.dev/api/magazine.json | jq -e '.name=="TaborPoolBoys" and (.issues|length)==5'
