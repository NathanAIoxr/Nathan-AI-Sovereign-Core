name: EYES Twin Engines
on:
  push:
    paths:
      - 'app-factory/nathan-ai/living-eyes/twin-engines*'
      - '.github/workflows/eyes-twin-engines-ci.yml'
  pull_request:
    paths:
      - 'app-factory/nathan-ai/living-eyes/twin-engines*'
      - '.github/workflows/eyes-twin-engines-ci.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app-factory/nathan-ai/living-eyes/twin-engines.js
      - run: node --test app-factory/nathan-ai/living-eyes/twin-engines.test.cjs
