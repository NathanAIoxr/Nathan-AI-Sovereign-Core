name: DMSP DIT API validation
on:
  pull_request:
    paths:
      - 'app-factory/nathan-ai/dmsp-dit/**'
      - '.github/workflows/dmsp-dit-ci.yml'
  push:
    paths:
      - 'app-factory/nathan-ai/dmsp-dit/**'
      - '.github/workflows/dmsp-dit-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate portal, private API, and department dispatch
        run: |
          node --check app-factory/nathan-ai/dmsp-dit/public/app.js
          node --test app-factory/nathan-ai/dmsp-dit/*.test.mjs
