name: DMSP DIT API validation
on:
  pull_request:
    paths:
      - 'app-factory/nathan-ai/dmsp-dit/**'
      - '.github/workflows/dmsp-dit-ci.yml'
  push:
    paths:
      - 'app-factory/nathan-ai/dmsp-dit/**'
      - '.github/workflows/dmsp-dit-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate public API and fail-closed private API
        run: node --test app-factory/nathan-ai/dmsp-dit/worker.test.mjs
