name: Nathan AI Live Chatbox & Skin
on:
  push:
    paths:
      - 'index.html'
      - 'app-factory/nathan-ai/hop-in/chatbox/**'
      - 'app-factory/nathan-ai/assistant/server.py'
      - 'app-factory/nathan-ai/assistant/test_chat_server.py'
      - '.github/workflows/live-chatbox-ci.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'app-factory/nathan-ai/hop-in/chatbox/**'
      - 'app-factory/nathan-ai/assistant/server.py'
      - 'app-factory/nathan-ai/assistant/test_chat_server.py'
      - '.github/workflows/live-chatbox-ci.yml'
jobs:
  test-chatbox:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check interactive components
        run: |
          node --check app-factory/nathan-ai/hop-in/chatbox/app.js
          node --check app-factory/nathan-ai/hop-in/chatbox/studio-core.js
          node --check app-factory/nathan-ai/hop-in/chatbox/studio.js
          node --check app-factory/nathan-ai/hop-in/chatbox/skin-core.js
          node --check app-factory/nathan-ai/hop-in/chatbox/skin.js
      - name: Chatbox, visual skin and source regression
        run: |
          node --test app-factory/nathan-ai/hop-in/chatbox/engine.test.cjs app-factory/nathan-ai/hop-in/chatbox/studio-core.test.cjs app-factory/nathan-ai/hop-in/chatbox/skin-core.test.cjs
          node --test app-factory/nathan-ai/hop-in/engine.test.cjs
      - name: Safe loopback adapter and model-chat packet tests
        run: python3 -B -m unittest discover -s app-factory/nathan-ai/assistant -p 'test_*.py'
