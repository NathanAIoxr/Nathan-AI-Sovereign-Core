name: Tabor Fiber Track Baller Smoke
on:
  push:
    paths:
      - 'app-factory/nathan-ai/fiber-arts-track-baller/**'
      - '.github/workflows/tabor-fiber-track-baller.yml'
  pull_request:
    paths:
      - 'app-factory/nathan-ai/fiber-arts-track-baller/**'
      - '.github/workflows/tabor-fiber-track-baller.yml'
  workflow_dispatch:
jobs:
  fiber-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build standalone Worker
        working-directory: app-factory/nathan-ai/fiber-arts-track-baller
        run: node scripts/build-worker.mjs
      - name: Verify 12 crafts and routes
        working-directory: app-factory/nathan-ai/fiber-arts-track-baller
        run: node --test tests/smoke.mjs
