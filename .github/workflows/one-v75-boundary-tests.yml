name: ONE v75 · Family & Member Boundary Tests
on:
  push:
    paths:
      - 'app-factory/nathan-ai/personal-intelligence/minds/federation/families-v75/**'
      - '.github/workflows/one-v75-boundary-tests.yml'
  pull_request:
    paths:
      - 'app-factory/nathan-ai/personal-intelligence/minds/federation/families-v75/**'
      - '.github/workflows/one-v75-boundary-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  count-and-boundary-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate 11 families / 99 roles and schedule endpoint invariants
        run: python3 -m unittest discover -s app-factory/nathan-ai/personal-intelligence/minds/federation/families-v75 -p test_simulate_indexing.py -v
      - name: Recreate synthetic weekly report
        run: python3 app-factory/nathan-ai/personal-intelligence/minds/federation/families-v75/simulate_indexing.py --days 7 --out /tmp/one-v75-weekly.json
