name: Sovereign Digital Stack
on:
  pull_request:
    paths:
      - 'sovereign-digital-stack/**'
      - '.github/workflows/sovereign-digital-stack.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to Cloudflare after tests'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sovereign-digital-stack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test worker.test.mjs
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    concurrency: sovereign-digital-stack-cloudflare
    environment: sovereign-digital-stack
    defaults:
      run:
        working-directory: sovereign-digital-stack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
