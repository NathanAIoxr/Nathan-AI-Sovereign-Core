name: Tabor Supercomputer Federation
on:
  pull_request:
    paths:
      - 'tabor-supercomputer-federation/**'
      - '.github/workflows/tabor-supercomputer-federation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tabor-supercomputer-federation/worker.test.mjs
