name: Tabor Academy Card Source Intake

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
      timezone: America/New_York
  push:
    branches: [main]
    paths:
      - 'app-factory/tabor-academy/card-games/wiki/**'
      - 'app-factory/game-reference-lab/morning-additions-238.json'
      - 'app-factory/game-reference-lab/morning-mechanics-taxonomy.json'
      - '.github/workflows/tabor-academy-card-source-intake.yml'

permissions:
  contents: read

concurrency:
  group: tabor-academy-card-research-production
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'NathanAIoxr/Nathan-AI-Sovereign-Core' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: app-factory/tabor-academy/card-games
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm test
      - name: Refresh Wikimedia and original sources
        env:
          WIKIMEDIA_ACCESS_TOKEN: ${{ secrets.WIKIMEDIA_ACCESS_TOKEN || secrets.WIKIPEDIA_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -eu
          npm run refresh-references -- --output "$RUNNER_TEMP/card-intake" --d1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card-source-receipt-and-build-backlog
          path: ${{ runner.temp }}/card-intake
          if-no-files-found: error
