name: TWEEZER-OS zone verification
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - app-factory/nathan-ai/tweezer-tap-os/**
      - .github/workflows/zone-switch.yml
permissions:
  contents: read
jobs:
  zone-brake-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify migrations, event delivery and audit sequence
        working-directory: app-factory/nathan-ai/tweezer-tap-os
        run: node test.mjs
