name: Tabor Academy Minds · Lasso of Truth

on:
  pull_request:
    paths:
      - 'app-factory/tabor-academy/minds/**'
      - 'app-factory/nathan-ai/minds-chat/**'
      - 'deployments/conductor/academy/minds.json'
      - '.github/workflows/tabor-academy-minds.yml'
  push:
    branches: [main]
    paths:
      - 'app-factory/tabor-academy/minds/**'
      - 'app-factory/nathan-ai/minds-chat/**'
      - 'app-factory/nathan-ai/personal-intelligence/minds/mind-of-minds/catalog.json'
      - 'app-factory/nathan-ai/agents-of-innocence/release-manifest.json'
      - 'app-factory/nathan-ai/omni-god/engine.js'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: app-factory/tabor-academy/minds

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --test minds.test.mjs

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'NathanAIoxr/Nathan-AI-Sovereign-Core'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: tabor-academy-minds-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node deploy.mjs
      - run: node verify-live.mjs --edge
