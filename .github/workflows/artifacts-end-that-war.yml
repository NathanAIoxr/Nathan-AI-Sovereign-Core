name: Artifacts end-that-war dossier tests
on:
  pull_request:
    paths:
      - 'creative-archive/persona-duality/**'
      - 'standalone-apps/artifacts-of-the-world/**'
      - '.github/workflows/artifacts-end-that-war.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test standalone-apps/artifacts-of-the-world/research/end-that-war-comparison.test.mjs
