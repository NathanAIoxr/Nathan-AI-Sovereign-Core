name: EYEPRINTS HANDPRINTS checks
on:
  push:
    paths:
      - 'app-factory/nathan-ai/eyeprints-handprints/**'
      - '.github/workflows/handprints-ci.yml'
  pull_request:
    paths:
      - 'app-factory/nathan-ai/eyeprints-handprints/**'
      - '.github/workflows/handprints-ci.yml'
permissions:
  contents: read
jobs:
  scanner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-factory/nathan-ai/eyeprints-handprints
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check vault.js
          node --check analysis.js
      - name: Run encryption and image analysis tests
        run: |
          node tests/crypto.mjs
          node tests/analysis.mjs
      - name: Check image privacy and static references
        run: |
          python tests/static_check.py
          test ! -d private-samples
          ! find . -type f \( -iname '*.jpeg' -o -iname '*.jpg' -o -iname '*.heic' \) | grep .
