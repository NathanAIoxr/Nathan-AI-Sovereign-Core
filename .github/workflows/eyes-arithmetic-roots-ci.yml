name: Nathan AI Ancient Arithmetic Roots
on:
  push:
    paths:
      - 'app-factory/nathan-ai/living-eyes/arithmetic-roots*'
      - 'app-factory/nathan-ai/living-eyes/eyes-lockdown.test.cjs'
      - '.github/workflows/eyes-arithmetic-roots-ci.yml'
  pull_request:
    paths:
      - 'app-factory/nathan-ai/living-eyes/arithmetic-roots*'
      - 'app-factory/nathan-ai/living-eyes/eyes-lockdown.test.cjs'
      - '.github/workflows/eyes-arithmetic-roots-ci.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app-factory/nathan-ai/living-eyes/arithmetic-roots.js
      - run: node --test app-factory/nathan-ai/living-eyes/arithmetic-roots.test.cjs
      - run: node --test app-factory/nathan-ai/living-eyes/eyes-lockdown.test.cjs
