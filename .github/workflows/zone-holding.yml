name: Zone holding deployment

on:
  push:
    branches: [main]
    paths:
      - 'zones/**'
      - '.github/workflows/zone-holding.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zone-holding-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify storage gate and record catalog
        run: |
          node --test zones/test.mjs
          node zones/inventory.mjs HEAD >/tmp/zone-source-inventory.json
      - name: Apply D1 migrations and deploy the holding Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::notice::Cloudflare deployment skipped because repository deploy credentials are unavailable."
            echo "Gate tests ran. Cloudflare deploy credentials are unavailable." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx --yes wrangler@4 d1 migrations apply ZONES --remote --config zones/wrangler.toml
          npx --yes wrangler@4 deploy --config zones/wrangler.toml --dispatch-namespace nathan-tabor-platforms
