name: Zone · HOLD STILL …. TWEEZERS … CAN YOU GET IT OUT?
on:
  push:
    branches:
      - 'zone/hold-still-tweezers'
    paths:
      - 'zones/isolated/hold-still-tweezers/**'
      - '.github/workflows/zone-hold-still-tweezers.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test zone.test.mjs
        working-directory: zones/isolated/hold-still-tweezers
