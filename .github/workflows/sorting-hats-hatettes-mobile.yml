name: Sorting Hats & Hatettes mobile resume checks

on:
  pull_request:
    paths:
      - 'app-factory/nathan-ai/sorting-hats-hatettes/**'
      - '.github/workflows/sorting-hats-hatettes-mobile.yml'
  push:
    branches: [main]
    paths:
      - 'app-factory/nathan-ai/sorting-hats-hatettes/**'
      - '.github/workflows/sorting-hats-hatettes-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: app-factory/nathan-ai/sorting-hats-hatettes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test game.test.mjs
      - run: node build.mjs /tmp/sorting-hats-hatettes-validation.mjs --root
