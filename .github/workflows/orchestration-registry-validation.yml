name: Orchestration registry validation
on:
  pull_request:
    paths:
      - 'orchestration/**'
      - 'scripts/validate-app-registry.mjs'
      - '.github/workflows/orchestration-registry-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: registry-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-app-registry.mjs
