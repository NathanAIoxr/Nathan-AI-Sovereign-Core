name: ONE - Universal Root13 Correctness Gate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  root13-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile exactness library and federation
        run: |
          F=app-factory/nathan-ai/personal-intelligence/minds/federation
          python3 -m py_compile "$F/fencepost-error-syndrome/core_primitives.py" "$F/fencepost-error-syndrome/universal_audit.py" "$F/federation.py"
      - name: Test 13 root controls and 8 established Fencepost workers
        run: |
          F=app-factory/nathan-ai/personal-intelligence/minds/federation
          python3 -m unittest discover -s "$F/fencepost-error-syndrome" -p 'test_core_primitives.py' -v
          python3 -m unittest discover -s "$F/fencepost-error-syndrome" -p 'test_fencepost_workers.py' -v
      - name: Test Tech108 boundaries and temporary ONE Federation master
        run: |
          F=app-factory/nathan-ai/personal-intelligence/minds/federation
          python3 -m unittest discover -s "$F/technology-v108" -p 'test_boundary_contract.py' -v
          python3 "$F/technology-v108/boundary_contract.py" --days 7 --out "/tmp/root13-tech108-simulation.json"
          python3 "$F/federation.py" --db "/tmp/ONE_Master_test.sqlite3" ingest "$F/technology-v108/registry.tech108.json"
          python3 "$F/technology-v108/boundary_contract.py" --verify-db "/tmp/ONE_Master_test.sqlite3"
          python3 "$F/federation.py" --db "/tmp/ONE_Master_test.sqlite3" ingest "$F/fencepost-error-syndrome/root13-workers.json"
          python3 -c 'import sqlite3; c=sqlite3.connect("/tmp/ONE_Master_test.sqlite3"); assert c.execute("SELECT COUNT(*) FROM federation_records").fetchone()[0] == 121; assert c.execute("SELECT COUNT(*) FROM federation_records WHERE record_id LIKE ?", ("mind:one-root13-worker-%",)).fetchone()[0] == 13; c.close()'
      - name: Test fail-closed gateway without creating a database
        run: |
          F=app-factory/nathan-ai/personal-intelligence/minds/federation
          printf '%s\n' '{"n":"integer","as_of":"iso_date"}' >"/tmp/contract.json"
          printf '%s\n' '{"n":0,"as_of":"2026-11-13"}' >"/tmp/valid.json"
          printf '%s\n' '{"n":0,"as_of":"11/13/2026"}' >"/tmp/invalid.json"
          python3 "$F/federation.py" --db "/tmp/MUST_NOT_EXIST.sqlite3" validate-boundaries "/tmp/valid.json" "/tmp/contract.json"
          if python3 "$F/federation.py" --db "/tmp/MUST_NOT_EXIST.sqlite3" validate-boundaries "/tmp/invalid.json" "/tmp/contract.json"; then
            echo "ERROR: invalid dates were accepted"
            exit 1
          fi
          if test -e "/tmp/MUST_NOT_EXIST.sqlite3"; then
            echo "ERROR: validation unexpectedly created a database"
            exit 1
          fi
      - name: Inventory potential adoption sites without modifying sources
        run: |
          F=app-factory/nathan-ai/personal-intelligence/minds/federation
          python3 "$F/fencepost-error-syndrome/universal_audit.py" --root . --out "/tmp/root13-adoption-inventory.json"
      - name: Upload public-only evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: one-root13-evidence
          path: |
            /tmp/root13-adoption-inventory.json
            /tmp/root13-tech108-simulation.json
          if-no-files-found: ignore
