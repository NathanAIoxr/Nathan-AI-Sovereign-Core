name: SMACK THAT ASS build
on:
  pull_request:
    paths:
      - 'app-factory/nathan-ai/smack-that-ass/**'
      - '.github/workflows/smack-that-ass.yml'
  push:
    branches: [main]
    paths:
      - 'app-factory/nathan-ai/smack-that-ass/**'
      - '.github/workflows/smack-that-ass.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: app-factory/nathan-ai/smack-that-ass
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check public/retribution.js
      - run: node --test worker.test.mjs
      - run: node build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: smack-that-ass-cloudflare
          path: |
            app-factory/nathan-ai/smack-that-ass/dist/site/
            app-factory/nathan-ai/smack-that-ass/dist/worker.mjs
            app-factory/nathan-ai/smack-that-ass/worker-metadata.json
          if-no-files-found: error
