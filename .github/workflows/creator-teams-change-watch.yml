name: NATHAN AI ONE v074 · Creator Teams & Change Watch
# Build website, book, code, research, publishing and restoration work products.
# GitHub runners are ephemeral. All source changes and restorations are reviewable.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
concurrency:
  group: nathan-creator-teams-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      drift_count: ${{ steps.teams.outputs.drift_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify creator teams, source locks, real git diffs and restoration branch guard
        run: |
          python3 -m unittest discover \
            -s app-factory/nathan-ai/personal-intelligence/minds/federation \
            -p test_team_factory.py -v
      - name: Verify Family 21 ONE and original Omega source preservation
        run: |
          python3 -m unittest discover             -s app-factory/nathan-ai/personal-intelligence/minds/federation             -p test_family_registry.py -v
      - name: Verify 70-dimensional 630-unit matrix and exact Family 65–75 uploads
        run: |
          set -euo pipefail
          F=app-factory/nathan-ai/personal-intelligence/minds/federation
          python3 -m unittest discover -s "$F/dimensions-v70" -p test_dimension_builder.py -v
      - name: Prepare existing ONE Federation main index
        run: |
          set -euo pipefail
          F=app-factory/nathan-ai/personal-intelligence/minds/federation
          W="$F/federation.py"
          C=app-factory/nathan-ai/personal-intelligence/minds/mind-of-minds/catalog.json
          python3 "$W" --db "$RUNNER_TEMP/ONE_Creator_Teams.sqlite3" init
          python3 "$W" --db "$RUNNER_TEMP/ONE_Creator_Teams.sqlite3" ingest \
            "$C" "$F/data/space-final-frontier-meru-v074.json" \
            "$F/data/nathan-method-integrated-v074.json"
          python3 "$W" --db "$RUNNER_TEMP/ONE_Creator_Teams.sqlite3" run \
            > "$RUNNER_TEMP/base-federation-audit.json"
      - name: Run all ten creator teams against published sources, books and code
        id: teams
        run: |
          set -euo pipefail
          F=app-factory/nathan-ai/personal-intelligence/minds/federation
          python3 "$F/team_factory.py" --root . --config "$F/creator-teams.v074.json" \
            --db "$RUNNER_TEMP/ONE_Creator_Teams.sqlite3" \
            --git-base HEAD^ \
            --output "$RUNNER_TEMP/NATHAN_TEAMS" > "$RUNNER_TEMP/creator-team-summary.json"
          python3 - "$RUNNER_TEMP/NATHAN_TEAMS" "$RUNNER_TEMP/ONE_Creator_Teams.sqlite3" "$GITHUB_OUTPUT" <<'PY'
          import json,sqlite3,sys
          from pathlib import Path
          output=Path(sys.argv[1])
          summary=json.loads((output/"summary.json").read_text())
          con=sqlite3.connect(sys.argv[2])
          assert summary["creator_teams"]==10,summary
          assert summary["family_slots"]==21,summary
          assert summary["family21_overlay_teams"]==10,summary
          assert summary["family_prior_definitions_unresolved"]==15,summary
          assert (output/"families/ONE_21_TEAM_OVERLAY.json").is_file()
          assert summary["registered_roles_assigned"]==763,summary
          assert summary["roles_excluded"]==0,summary
          assert summary["website_pages_checked"]>=5,summary
          assert summary["book_sources_preserved"]==1,summary
          assert summary["python_source_syntax_errors"]==0,summary
          assert summary["protected_source_locks_checked"]>=4,summary
          assert con.execute("SELECT COUNT(*) FROM creator_team_roles").fetchone()[0]==763
          assert con.execute("SELECT COUNT(*) FROM federation_records").fetchone()[0]==1326
          assert con.execute("PRAGMA quick_check").fetchone()[0]=="ok"
          assert (output/"website-inventory.html").is_file()
          assert (output/"books/THE_REBELLION_WORKING_EDITION.md").is_file()
          assert (output/"monitor/restore-proposals.md").is_file()
          print(f"10 real workstreams, 763 assigned source-role templates, {summary['website_pages_checked']} websites audited, {summary['pending_proposed_work_items']} proposed next tasks")
          with open(sys.argv[3],"a") as f:
              f.write(f"drift_count={summary['protected_original_drift_count']}\n")
          PY
      - name: Execute all 630 dimensional source-index workcards in the ONE master
        run: |
          set -euo pipefail
          F=app-factory/nathan-ai/personal-intelligence/minds/federation
          DB="$RUNNER_TEMP/ONE_Creator_Teams.sqlite3"
          python3 "$F/dimensions-v70/dimension_builder.py" --db "$DB" build \
            --out "$RUNNER_TEMP/DIMENSION_70_WORKCARDS" > "$RUNNER_TEMP/dimension-70-summary.json"
          python3 - "$RUNNER_TEMP/DIMENSION_70_WORKCARDS" "$DB" <<'PY'
          from pathlib import Path
          import json,sqlite3,sys
          work=Path(sys.argv[1])
          db=sqlite3.connect(sys.argv[2])
          manifest=json.loads((work/"MANIFEST.json").read_text())
          assert manifest["tier_count"]==7 and manifest["dimensional_families"]==70
          assert manifest["dimensional_workcards"]==630
          assert manifest["source_family65_to75_count"]==11
          assert manifest["source_member65_to163_count"]==99
          assert manifest["family_archetype_and_dimensional_unit_namespaces_distinct"] is True
          assert manifest["real_world_operations"]==0
          assert len(list((work/"units").glob("DIM-??-??.json")))==630
          assert len(list((work/"tiers").glob("TIER_*.json")))==7
          assert db.execute("SELECT COUNT(*) FROM dimension70_units").fetchone()[0]==630
          assert db.execute("SELECT COUNT(*) FROM dimension70_family75_links").fetchone()[0]==99
          assert db.execute("SELECT COUNT(*) FROM creator_team_roles").fetchone()[0]==763
          assert db.execute("PRAGMA quick_check").fetchone()[0]=="ok"
          print("Dimensional index: 70 × 9 = 630; Family 65–75: 11 × 9 = 99, independent namespaces")
          PY
      - name: Publish 630 source-linked dimensional workcards and 99-family crosswalk
        uses: actions/upload-artifact@v4
        with:
          name: nathan-one-v074-dimensional-70-630
          path: ${{ runner.temp }}/DIMENSION_70_WORKCARDS/
          retention-days: 14
      - name: Publish source-safe team deliverables and monitoring report
        uses: actions/upload-artifact@v4
        with:
          name: nathan-one-v074-creator-teams
          path: ${{ runner.temp }}/NATHAN_TEAMS/
          retention-days: 14
      - name: Report original change risk without auto-overwriting
        run: |
          python3 - "$RUNNER_TEMP/NATHAN_TEAMS/summary.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          print(f"Protected-source drift count: {d['protected_original_drift_count']}")
          print(f"Tracked commit changes recorded: {d['tracked_committed_changes']}")
          print("A protected-source drift opens a separate owner-review restoration proposal; no automatic merge.")
          PY

  propose-restoration-on-drift:
    needs: audit-and-build
    if: ${{ github.event_name != 'pull_request' && needs.audit-and-build.outputs.drift_count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare exact pinned originals on a review branch; do not modify main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          F=app-factory/nathan-ai/personal-intelligence/minds/federation
          branch="bot/creator-source-restore-v074-${GITHUB_SHA:0:12}"
          if gh pr list --state open --head "$branch" --json number --jq 'length' | grep -qx '[1-9][0-9]*'; then
            echo "A draft restoration PR already exists for this exact main revision."
            exit 0
          fi
          git config user.name "nathan-ai-source-protection[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          python3 "$F/team_factory.py" --root . --config "$F/creator-teams.v074.json" \
            --apply-review-restoration
          if git diff --quiet; then
            echo "No owner-protected originals need restoration."
            exit 0
          fi
          git add -- \
            app-factory/nathan-ai/original-works/the-rebellion/2026-11-13/AUTHOR_ORIGINAL_WORDS.md \
            app-factory/nathan-ai/original-works/JOHN_NATHAN_TABOR_SINCE_1973_MASTER_WORDS.md \
            app-factory/nathan-ai/personal-intelligence/minds/federation/source-packs/law-of-order-books-2026-11-13/CREATOR_ORIGINALS.txt \
            "app-factory/nathan-ai/personal-intelligence/minds/federation/source-packs/law-of-order-books-2026-11-13/Pasted text.txt" \
            app-factory/nathan-ai/personal-intelligence/minds/federation/families/USER_SUPPLIED_FAMILIES_16_TO_21_20261113.txt \
            app-factory/nathan-ai/personal-intelligence/minds/federation/families-v75/USER_UPLOADED_EXACT_65_75_20261113.txt \
            app-factory/nathan-ai/personal-intelligence/minds/federation/dimensions-v70/USER_UPLOADED_EXACT_DIMENSIONS_0_69_20261113.txt
          git diff --cached --quiet && exit 0
          git commit -m "restore(proposal): return creator originals to pinned Git objects for owner review"
          if git push origin "$branch"; then
            if ! gh pr create --draft --base main --head "$branch" \
              --title "Creator source preservation: review exact-original restoration" \
              --body "Automatic monitor found differences in pinned author-original files. This DRAFT PR proposes exact restoration for explicitly pinned original-source paths to their recorded original Git objects. Inspect the diff before merging. No editorial, code or website changes are reverted. The owner decides whether later changes were authorized."; then
              gh issue create \
                --title "Review owner-original source drift (restoration branch prepared)" \
                --body "The exact-original restoration branch was pushed but could not automatically open a PR. Compare the bot/creator-source-restore-v074 branch against main and review before merge." || true
            fi
          else
            gh issue create \
              --title "Owner-original drift requires a review restoration" \
              --body "The creator-team monitor detected a changed pinned original. Download the team audit artifact, inspect the source-lock report and prepare a review-only restoration PR." || true
          fi
