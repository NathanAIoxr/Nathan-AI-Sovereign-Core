name: SHIT TIHS
on:
  push:
    paths:
      - 'app-factory/nathan-ai/shit-tihs/**'
      - '.github/workflows/shit-tihs.yml'
  pull_request:
    paths:
      - 'app-factory/nathan-ai/shit-tihs/**'
      - '.github/workflows/shit-tihs.yml'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: app-factory/nathan-ai/shit-tihs
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/build-worker.mjs
      - run: node --test tests/*.test.mjs
