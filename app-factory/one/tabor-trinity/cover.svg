<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
<title id="title">The Tabor Trinity: the source, manifestation and cipher</title>
<desc id="desc">Gold and electric blue cosmic triangle: Taboric Light field above; Light of Tabor manifestation left; Tabor Light Cipher wave right; THE ONE protected in center.</desc>
<defs>
<radialGradient id="space"><stop stop-color="#244774"/><stop offset=".57" stop-color="#0b1d36"/><stop offset="1" stop-color="#050b15"/></radialGradient>
<radialGradient id="gold"><stop stop-color="#fff6be"/><stop offset=".15" stop-color="#ffde77"/><stop offset=".4" stop-color="#c18438"/><stop offset=".84" stop-color="#102642"/><stop offset="1" stop-color="#07111b"/></radialGradient>
<radialGradient id="core"><stop stop-color="#fffcd3"/><stop offset=".23" stop-color="#f4bd68"/><stop offset=".48" stop-color="#126eaa"/><stop offset="1" stop-color="#0b172a"/></radialGradient>
<filter id="glow"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="740" fill="url(#space)"/>
