services:
  edge:
    build:
      context: .
      dockerfile: Dockerfile
    image: nathan-ai-six-dogs-edge:local
    network_mode: "none"
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: "1.0"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=10001,gid=10001
    volumes:
      - sixdogs_vectors:/data
    secrets:
      - vector_key
    command: ["python", "runner.py", "--demo"]

secrets:
  vector_key:
    file: ./secrets/vector_key

volumes:
  sixdogs_vectors:
