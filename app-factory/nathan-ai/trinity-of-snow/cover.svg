 <text x="0" y="42" fill="#163a5c" text-anchor="middle" font-family="Georgia,serif" font-size="36" font-weight="bold">2 · FORM</text>
 <text x="0" y="271" fill="#163a5c" text-anchor="middle" font-family="Georgia,serif" font-size="37" font-weight="bold">3 · EARTH</text>
 <text x="0" y="303" fill="#163a5c" text-anchor="middle" font-family="Georgia,serif" font-size="21">CREATION</text>
