<g transform="translate(800 910)"><rect x="-650" y="-35" width="1300" height="74" rx="12" fill="#092641" stroke="#dfba6b" stroke-width="3"/><text x="0" y="-5" text-anchor="middle" fill="#f7dea5" font-family="Georgia,serif" font-size="23" font-weight="bold">SNOW · SEED-BEARING PLANTS · COCA-DERIVED COCAINE · MUSHROOMS</text><text x="0" y="22" text-anchor="middle" fill="#e5f3ff" font-family="Georgia,serif" font-size="17">KJV: JOB 37:6 · JOB 38:22 · PSALM 147:16 · GENESIS 1:29</text></g>
<text x="800" y="993" fill="#dbeeff" text-anchor="middle" font-family="sans-serif" font-size="16">SYMBOLIC COMPARISON ONLY · SCRIPTURE DOES NOT EQUATE THESE SUBSTANCES WITH SNOW</text>
</svg>