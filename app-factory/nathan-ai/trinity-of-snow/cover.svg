<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
<title id="title">The Trinity of Snow — Nathan Tabor</title>
<desc id="desc">Original illuminated winter manuscript-style symbolic artwork: three luminous snow spheres represent Spirit, Form, and Earth. Beneath them, plant, crystal, and fungal forms are presented as an authored comparison, not biblical identifications.</desc>
<defs>
 <radialGradient id="sky"><stop stop-color="#2b648f"/><stop offset=".6" stop-color="#102c51"/><stop offset="1" stop-color="#061326"/></radialGradient>
 <radialGradient id="snow" cx=".35" cy=".2"><stop stop-color="#fff"/><stop offset=".6" stop-color="#d8f1ff"/><stop offset="1" stop-color="#75a8cc"/></radialGradient>
 <linearGradient id="gold"><stop stop-color="#ad7e31"/><stop offset=".35" stop-color="#ffe6a5"/><stop offset=".7" stop-color="#e7be6c"/><stop offset="1" stop-color="#9c6b2b"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="14"/></filter>
 <pattern id="stars" width="115" height="115" patternUnits="userSpaceOnUse"><circle cx="12" cy="17" r="2" fill="#e9f8ff" opacity=".75"/><circle cx="91" cy="81" r="1" fill="#fce0a0" opacity=".8"/></pattern>
</defs>
<rect width="1600" height="1050" fill="url(#sky)"/><rect width="1600" height="1050" fill="url(#stars)"/>
<rect x="22" y="22" width="1556" height="1006" rx="24" stroke="url(#gold)" stroke-width="9" fill="none"/><rect x="44" y="44" width="1512" height="962" rx="10" stroke="#8ebcdd" stroke-width="2" fill="none"/>
<path d="M150 370Q390 140 800 260Q1210 120 1450 370" fill="none" stroke="#bceaff" stroke-width="10" opacity=".12" filter="url(#glow)"/>
<text x="800" y="142" text-anchor="middle" fill="#f7da98" font-family="Georgia,serif" font-size="86" font-weight="bold" letter-spacing="6">THE TRINITY OF SNOW</text>
<text x="800" y="196" text-anchor="middle" fill="#e9f8ff" font-family="Georgia,serif" font-size="28" letter-spacing="5">THE 1380 BOOK OF LIGHTS · NATHAN TABOR</text>
<g stroke="#e2f3ff" stroke-width="2" opacity=".55">
 <path d="M110 290v120m-60-60h120m-102-42l84 84m0-84l-84 84"/><path d="M1490 290v120m-60-60h120m-102-42l84 84m0-84l-84 84"/>
