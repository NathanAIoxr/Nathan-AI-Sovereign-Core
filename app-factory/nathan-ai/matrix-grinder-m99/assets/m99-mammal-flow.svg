<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850"><rect width="1200" height="850" fill="#061b35"/><text x="600" y="65" text-anchor="middle" fill="#ffce70" font-family="Arial" font-weight="bold" font-size="37">M-99 • LIVING MAMMAL FLOW</text><text x="600" y="104" text-anchor="middle" fill="white" font-family="Arial" font-size="20">Anatomical analogies — one heart, two calf muscle pumps</text><g font-family="Arial"><rect x="50" y="150" width="350" height="140" rx="18" fill="#113453" stroke="#50caff" stroke-width="3"/><text x="225" y="202" font-size="21" font-weight="bold" fill="#fff" text-anchor="middle">SENSORY ARRAY</text><text x="225" y="239" font-size="15" fill="#b8e8ff" text-anchor="middle">Eyes • ears • skin • balance</text><rect x="420" y="150" width="350" height="140" rx="18" fill="#113453" stroke="#50caff" stroke-width="3"/><text x="595" y="202" font-size="21" font-weight="bold" fill="#fff" text-anchor="middle">BRAIN CONTROL</text><text x="595" y="239" font-size="15" fill="#b8e8ff" text-anchor="middle">Brainstem • hypothalamus • rhythms</text><rect x="790" y="150" width="350" height="140" rx="18" fill="#113453" stroke="#50caff" stroke-width="3"/><text x="965" y="202" font-size="21" font-weight="bold" fill="#fff" text-anchor="middle">ATMOSPHERIC INTAKE</text><text x="965" y="239" font-size="15" fill="#b8e8ff" text-anchor="middle">Nose • airways • lungs</text><rect x="50" y="350" width="350" height="140" rx="18" fill="#113453" stroke="#ffb95c" stroke-width="3"/><text x="225" y="402" font-size="21" font-weight="bold" fill="#fff" text-anchor="middle">CENTRAL HEART</text><text x="225" y="439" font-size="15" fill="#b8e8ff" text-anchor="middle">One anatomical heart • circulation</text><rect x="420" y="350" width="350" height="140" rx="18" fill="#113453" stroke="#50caff" stroke-width="3"/><text x="595" y="402" font-size="21" font-weight="bold" fill="#fff" text-anchor="middle">DISTRIBUTED PROCESSING</text><text x="595" y="439" font-size="15" fill="#b8e8ff" text-anchor="middle">Neural integration • metabolism</text><rect x="790" y="350" width="350" height="140" rx="18" fill="#113453" stroke="#50caff" stroke-width="3"/><text x="965" y="402" font-size="21" font-weight="bold" fill="#fff" text-anchor="middle">FILTER & DEFEND</text><text x="965" y="439" font-size="15" fill="#b8e8ff" text-anchor="middle">Liver • kidneys • immune • lymph</text><rect x="50" y="550" width="350" height="140" rx="18" fill="#113453" stroke="#50caff" stroke-width="3"/><text x="225" y="602" font-size="21" font-weight="bold" fill="#fff" text-anchor="middle">LEFT CALF PUMP</text><text x="225" y="639" font-size="15" fill="#b8e8ff" text-anchor="middle">Muscle contraction • venous valves</text><rect x="420" y="550" width="350" height="140" rx="18" fill="#113453" stroke="#50caff" stroke-width="3"/><text x="595" y="602" font-size="21" font-weight="bold" fill="#fff" text-anchor="middle">RIGHT CALF PUMP</text><text x="595" y="639" font-size="15" fill="#b8e8ff" text-anchor="middle">Muscle contraction • venous valves</text><rect x="790" y="550" width="350" height="140" rx="18" fill="#113453" stroke="#50caff" stroke-width="3"/><text x="965" y="602" font-size="21" font-weight="bold" fill="#fff" text-anchor="middle">VENOUS RETURN</text><text x="965" y="639" font-size="15" fill="#b8e8ff" text-anchor="middle">Veins → heart → lungs → heart</text></g><text x="600" y="803" text-anchor="middle" fill="#ffce70" font-family="Arial" font-size="21">SENSE → REGULATE → CIRCULATE → PROCESS → RETURN → REPEAT</text></svg>