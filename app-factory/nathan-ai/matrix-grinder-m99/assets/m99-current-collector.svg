<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880"><rect width="1200" height="880" fill="#061b35"/><text x="600" y="57" text-anchor="middle" fill="#ffce70" font-family="Arial" font-weight="bold" font-size="37">UNIVERSAL HARMONIC GYRE BOX</text><text x="600" y="96" text-anchor="middle" fill="white" font-family="Arial" font-size="19">Current collector registry • measurable systems and conceptual correspondences</text><g font-family="Arial"><rect x="50" y="130" width="525" height="128" rx="18" fill="#0e3657" stroke="#dca951" stroke-width="3"/><text x="312" y="177" font-size="25" fill="#ffce70" font-weight="bold" text-anchor="middle">COSMIC</text><text x="312" y="214" font-size="19" fill="white" text-anchor="middle">Solar wind • plasma • radiation</text><rect x="625" y="130" width="525" height="128" rx="18" fill="#0e3657" stroke="#dca951" stroke-width="3"/><text x="887" y="177" font-size="25" fill="#ffce70" font-weight="bold" text-anchor="middle">ATMOSPHERE</text><text x="887" y="214" font-size="19" fill="white" text-anchor="middle">Winds • pressure • convection</text><rect x="50" y="295" width="525" height="128" rx="18" fill="#0e3657" stroke="#dca951" stroke-width="3"/><text x="312" y="342" font-size="25" fill="#ffce70" font-weight="bold" text-anchor="middle">OCEAN</text><text x="312" y="379" font-size="19" fill="white" text-anchor="middle">Gyres • eddies • overturning</text><rect x="625" y="295" width="525" height="128" rx="18" fill="#0e3657" stroke="#dca951" stroke-width="3"/><text x="887" y="342" font-size="25" fill="#ffce70" font-weight="bold" text-anchor="middle">RIVERS</text><text x="887" y="379" font-size="19" fill="white" text-anchor="middle">Streamflow • groundwater</text><rect x="50" y="460" width="525" height="128" rx="18" fill="#0e3657" stroke="#dca951" stroke-width="3"/><text x="312" y="507" font-size="25" fill="#ffce70" font-weight="bold" text-anchor="middle">EARTH</text><text x="312" y="544" font-size="19" fill="white" text-anchor="middle">Geothermal • telluric • magnetic</text><rect x="625" y="460" width="525" height="128" rx="18" fill="#0e3657" stroke="#dca951" stroke-width="3"/><text x="887" y="507" font-size="25" fill="#ffce70" font-weight="bold" text-anchor="middle">BODY</text><text x="887" y="544" font-size="19" fill="white" text-anchor="middle">Blood • lymph • neural signals</text><rect x="50" y="625" width="525" height="128" rx="18" fill="#0e3657" stroke="#dca951" stroke-width="3"/><text x="312" y="672" font-size="25" fill="#ffce70" font-weight="bold" text-anchor="middle">HARMONICS</text><text x="312" y="709" font-size="19" fill="white" text-anchor="middle">Frequency • phase • amplitude</text><rect x="625" y="625" width="525" height="128" rx="18" fill="#0e3657" stroke="#dca951" stroke-width="3"/><text x="887" y="672" font-size="25" fill="#ffce70" font-weight="bold" text-anchor="middle">ENERGY</text><text x="887" y="709" font-size="19" fill="white" text-anchor="middle">Measure source • losses • storage</text></g><text x="600" y="837" text-anchor="middle" fill="#9de1ff" font-family="Arial" font-size="17">No universal 432 Hz truth frequency • No perpetual energy claim • Preserve physical distinctions</text></svg>