name = "tabor-bridge"
main = "tabor-bridge.js"
compatibility_date = "2026-10-20"
workers_dev = true
preview_urls = false

[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[[dispatch_namespaces]]
binding = "MEMORY_PLATFORM"
namespace = "nathan-tabor-platforms"

[[secrets_store_secrets]]
binding = "EDGE_HEALTH_KEY"
store_id = "8e0b9cfaacfa44c7bceec1445db02dd1"
secret_name = "TABOR_EDGE_OPERATIONS_HEALTH_KEY"
