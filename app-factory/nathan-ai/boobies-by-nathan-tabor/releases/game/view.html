<p class="eyebrow">Game</p>
<h1>SNOT</h1>
<p class="lede"><strong>Sensationally Navigating Ouroboroi Tactfully.</strong> Flip the calculator code and pick the word that zeroes out each simulated trap.</p>
<section class="panel" aria-labelledby="round">
  <div class="rail"><span id="round">Round 1 of 6</span><span id="score">Score 0 / 6</span></div>
  <div class="digits" role="img" id="display"></div>
  <div class="controls"><button id="flip" type="button" aria-pressed="false">Flip the display</button></div>
  <div class="controls" id="choices" aria-label="Choose a word"></div>
  <p id="feedback" class="release-status" role="status"></p>
  <div class="controls">
    <button id="next" class="primary" type="button" disabled>Next trap</button>
    <button id="reset" type="button">Start over</button>
  </div>
</section>
