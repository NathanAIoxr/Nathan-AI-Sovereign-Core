<p class="eyebrow">AI · Local classifier</p>
<h1>AI Router</h1>
<p class="lede">Describe what you want to do. The browser scores words against a small training set and suggests a BOOBIES release.</p>
<div class="split">
  <form class="panel" id="route-form">
    <label for="request">Your request</label>
    <textarea id="request" maxlength="1000" required placeholder="I want to flip a calculator number to read BOOBLESS."></textarea>
    <div class="controls"><button class="primary" type="submit">Find a release</button></div>
  </form>
  <section class="panel" aria-label="Classifier result">
    <h2>Pick a destination</h2>
    <p id="decision" class="release-status" role="status">Enter a request to classify.</p>
    <p id="evidence" class="note"></p>
    <a id="destination" hidden></a>
  </section>
</div>
