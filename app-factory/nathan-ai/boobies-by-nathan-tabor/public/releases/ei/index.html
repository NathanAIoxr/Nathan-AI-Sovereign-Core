<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#240e16">
<title>BOOBIES by Nathan Tabor · EI</title>
<style>
:root {
  color-scheme: dark;
  --background: #240e16;
  --panel: #31131e;
  --panel-dark: #170a10;
  --line: #67404a;
  --ink: #fce8ba;
  --muted: #debda7;
  --gold: #ffc774;
  --green: #c6e88e;
  --display: Georgia, serif;
  --body: system-ui, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  color: var(--ink);
  background: radial-gradient(ellipse at 16% 4%, #551f31, var(--background) 37rem);
  font: 1rem/1.57 var(--body);
}
a { color: var(--gold); text-underline-offset: .22em; }
a:hover { color: #fff0cc; }
:focus-visible { outline: 3px solid var(--green); outline-offset: 3px; }
.mast, main, footer { width: min(100% - 2rem, 69rem); margin-inline: auto; }
.mast {
  min-height: 4.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .65rem;
  border-bottom: .24rem double var(--line);
}
.mast a { text-decoration: none; }
.mast a:first-child { font: bold clamp(1rem, 3vw, 1.35rem) var(--display); }
.mast i { font-weight: normal; }
.nav, footer a { font: 600 .83rem var(--body); white-space: nowrap; }
main { padding: clamp(1.65rem, 4vw, 3.65rem) 0; min-height: 75vh; }
.eyebrow {
  margin: 0 0 .35rem;
  color: var(--gold);
  font-weight: 750;
  font-size: .78rem;
  letter-spacing: .18em;
  text-transform: uppercase;
}
h1, h2, h3, p { margin-block: 0 .65rem; }
h1 { font: bold clamp(2.6rem, 8vw, 6rem)/.95 var(--display); letter-spacing: -.045em; }
h2 { font: bold clamp(1.35rem, 3vw, 2.05rem)/1.12 var(--display); }
h3 { font: bold 1.2rem var(--display); }
.lede { max-width: 49rem; color: var(--muted); margin-block: .9rem 1.65rem; }
.panel, .card {
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: .4rem;
  padding: clamp(1rem, 3vw, 1.55rem);
}
.grid { display: grid; gap: .9rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); }
.split { display: grid; gap: 1rem; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 50rem) { .split { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.card { display: flex; flex-direction: column; }
.card p { color: var(--muted); flex: 1; }
.card a { align-self: start; font-weight: 700; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: .55rem; margin-block: .85rem; }
label { font-weight: 650; display: block; margin-block: .55rem .3rem; }
label.check { display: flex; gap: .65rem; align-items: baseline; margin-block: .5rem; font-weight: normal; }
input:not([type=checkbox]), textarea, select, button {
  color: var(--ink); border: 1px solid #93606b; border-radius: .28rem;
  font: inherit; padding: .6rem .72rem; background: var(--panel-dark);
}
input:not([type=checkbox]), textarea, select { width: 100%; }
textarea { resize: vertical; min-height: 7.5rem; }
button { cursor: pointer; min-height: 2.75rem; font-weight: 700; }
button.primary { color: #290f16; background: var(--gold); border-color: var(--gold); }
button:hover:not(:disabled), button[aria-pressed=true] { border-color: var(--gold); }
button:disabled { opacity: .6; cursor: default; }
button[aria-selected=true] { color: #290f16; background: var(--gold); }
.signal { color: var(--green); }
.digits {
  position: relative; min-height: 6.5rem; display: flex; justify-content: center; align-items: center;
  background: #201318; color: var(--gold); border: 2px solid #966f54; border-radius: .35rem;
  padding: .8rem .3rem; overflow: hidden;
}
.segment-row { display: flex; gap: clamp(.12rem, 1vw, .5rem); transition: transform .35s ease; }
.segment-row.flip { transform: rotate(180deg); }
.segment { width: clamp(1.1rem, 7vw, 2.45rem); aspect-ratio: .59; position: relative; }
.segment i { display: block; background: #412b2c; position: absolute; border-radius: .15rem; }
.segment i.on { background: var(--gold); box-shadow: 0 0 .5rem #fb762275; }
.segment i:nth-child(-n+3) { left: 18%; width: 64%; height: 8%; }
.segment i:nth-child(1) { top: 0; }
.segment i:nth-child(2) { top: 46%; }
.segment i:nth-child(3) { bottom: 0; }
.segment i:nth-child(n+4) { width: 13%; height: 34%; }
.segment i:nth-child(4) { top: 9%; left: 0; }
.segment i:nth-child(5) { top: 9%; right: 0; }
.segment i:nth-child(6) { bottom: 9%; left: 0; }
.segment i:nth-child(7) { bottom: 9%; right: 0; }
output { display: block; color: var(--green); margin-block: .55rem; font: 700 1.17rem/1.45 ui-monospace, monospace; overflow-wrap: anywhere; }
.rail { display: flex; justify-content: space-between; gap: .4rem; color: var(--muted); margin-bottom: .75rem; flex-wrap: wrap; }
.note, small { color: var(--muted); }
.wordmark { color: var(--green); text-align: center; font: 700 clamp(2rem, 8vw, 4rem) var(--display); margin-block: .8rem; letter-spacing: .08em; }
.console { font: 1rem/1.55 ui-monospace, monospace; padding: 1rem; background: var(--panel-dark); border: 1px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; }
.short-list { padding-inline-start: 1.25rem; }
.release-status { min-height: 1.5rem; font-weight: 650; color: var(--green); }
footer { display: flex; justify-content: space-between; gap: .65rem; align-items: baseline; padding: 1.15rem 0 1.4rem; border-top: .24rem double var(--line); font: bold 1rem var(--display); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } }
</style>
</head>
<body>
<header class="mast">
  <a href="../index.html" aria-label="All BOOBIES releases">BOOBIES <i>by Nathan Tabor</i></a>
  <a class="nav" href="../index.html">All releases <span aria-hidden="true">↗</span></a>
</header>
<main>
<p class="eyebrow">EI</p>
<h1>Message Review</h1>
<p class="lede">Choose the tone you want and see which wording the local rules flag for a second look.</p>
<div class="split">
  <form id="review-form" class="panel">
    <label for="tone">Target tone</label>
    <select id="tone"><option value="direct">Direct</option><option value="calm">Calm</option><option value="collaborative">Collaborative</option></select>
    <label for="message">Your message</label>
    <textarea id="message" maxlength="2000" required></textarea>
    <div class="controls"><button type="submit" class="primary">Review message</button></div>
  </form>
  <section class="panel" aria-label="Message findings">
    <h2>Review</h2>
    <p id="review-count" class="release-status" role="status">Enter a message to review.</p>
    <ul id="findings" class="short-list"></ul>
  </section>
</div>

</main>
<footer><span>I DONT OWE YOU …</span> <a href="../../index.html">Poster gallery ↗</a></footer>
<script>
"use strict";
const byId = id => document.getElementById(id);

const flipLetters = { 0: 'O', 1: 'I', 2: 'Z', 3: 'E', 4: 'h', 5: 'S', 6: 'g', 7: 'L', 8: 'B', 9: 'g' };
const flipDigits = { O: '0', I: '1', Z: '2', E: '3', H: '4', S: '5', G: '6', L: '7', B: '8' };
const segmentMasks = ['1011111', '0000101', '1110110', '1110101', '0101101', '1111001', '1111011', '1000101', '1111111', '1111101'];

function readFlip(digits) {
  return Array.from(digits).reverse().map(digit => flipLetters[digit] ?? '?').join('');
}

function makeFlip(word) {
  return Array.from(word.toUpperCase()).reverse().map(letter => flipDigits[letter] ?? '?').join('');
}

function showDigits(display, digits, flipped = false) {
  const row = document.createElement('div');
  row.className = flipped ? 'segment-row flip' : 'segment-row';
  row.setAttribute('aria-hidden', 'true');
  for (const digit of digits) {
    const frame = document.createElement('span');
    frame.className = 'segment';
    for (const bit of segmentMasks[Number(digit)]) {
      const segment = document.createElement('i');
      if (bit === '1') segment.className = 'on';
      frame.append(segment);
    }
    row.append(frame);
  }
  display.replaceChildren(row);
  display.setAttribute('aria-label', flipped ? readFlip(digits) : digits);
}

function readStored(key, fallback) {
  try {
    return JSON.parse(localStorage.getItem('boobies.' + key)) ?? fallback;
  } catch {
    return fallback;
  }
}

function saveStored(key, value) {
  try {
    localStorage.setItem('boobies.' + key, JSON.stringify(value));
    return true;
  } catch {
    return false;
  }
}

const releases = [{"id":"app","name":"App","title":"Flip Calculator","description":"Turn the seven-segment display 180° and read the result."},{"id":"game","name":"Game","title":"SNOT","description":"Flip six calculator codes to zero out simulated traps."},{"id":"os","name":"OS","title":"BOOBIES OS","description":"Open a browser desktop with a calculator, a SNOT log, and local notes."},{"id":"sos","name":"SoS","title":"BOOBIES SoS","description":"Open the independent releases and check whether each endpoint responds."},{"id":"agi","name":"AGI","title":"AGI Planner","description":"Turn a goal and its constraints into a local checklist with completion evidence."},{"id":"ai","name":"AI","title":"AI Router","description":"Classify a project request locally and open the matching release."},{"id":"si","name":"SI","title":"SI Pattern Workbench","description":"Translate flip words into digit strings and digit strings into words."},{"id":"ei","name":"EI","title":"EI Message Review","description":"Review a message against the tone you choose and inspect the exact phrases flagged."},{"id":"ae","name":"AE","title":"AE Sequence Runner","description":"Run an ordered sequence of local text transformations and inspect every result."}];
const toneRules = {
  direct: [
    [/\b(maybe|just wondering|sort of|kind of)\b/gi, 'Consider naming the action you want.'],
    [/\b(as soon as possible|whenever you can)\b/gi, 'Give a specific deadline if there is one.'],
  ],
  calm: [
    [/\b(always|never|obviously|ridiculous)\b/gi, 'Consider replacing a general judgment with a specific event.'],
    [/!{2,}/g, 'Consider a single punctuation mark.'],
  ],
  collaborative: [
    [/\b(you need to|your fault|you failed to)\b/gi, 'Consider describing the next step and who owns it.'],
    [/\b(do it now|figure it out|fix it)\b/gi, 'Specify what needs to happen and the deadline.'],
  ],
};

byId('review-form').addEventListener('submit', event => {
  event.preventDefault();
  const message = byId('message').value;
  const rules = toneRules[byId('tone').value];
  const matches = rules.flatMap(([pattern, suggestion]) => [...message.matchAll(pattern)].map(match => {
    return { original: match[0], position: match.index, suggestion };
  })).sort((a, b) => a.position - b.position);
  const entries = matches.map(({ original, suggestion }) => {
    const item = document.createElement('li');
    const quote = document.createElement('strong');
    quote.textContent = '“' + original + '”';
    item.append(quote, ' · ' + suggestion);
    return item;
  });
  byId('findings').replaceChildren(...entries);
  byId('review-count').textContent = matches.length ? matches.length + ' phrase matches.' : 'No phrases matched the selected rules.';
});
</script>
</body>
</html>
