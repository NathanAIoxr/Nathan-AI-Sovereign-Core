name = "tabor-build-loop"
main = "worker.mjs"
compatibility_date = "2026-11-17"
workers_dev = true

[observability]
enabled = true

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "tabor-autonomous-builds"
database_id = "f6d6879c-3b15-4ca0-93d4-1da1860b3b55"

[durable_objects]
bindings = [{ name = "DISPATCHER", class_name = "BuildDispatcher" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BuildDispatcher"]

[ai]
binding = "AI"

[vars]
GITHUB_REPOSITORY = "NathanAIoxr/Nathan-AI-Sovereign-Core"
GITHUB_DRAFT_BRANCH = "automation/tabor-build-drafts"
WORKERS_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
OPENAI_MODEL = "gpt-4.1-mini"
