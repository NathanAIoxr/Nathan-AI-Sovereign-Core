<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">GODSALTER — The Franchise by Nathan Tabor</title>
<desc id="d">Cinematic black, violet, midnight-blue and gold launch companion featuring a three-dimensional franchise framework and a glowing cosmic portal beneath two moons. Scalable vector art, not the original rendered PNG.</desc>
<defs>
 <radialGradient id="bg"><stop stop-color="#222345"/><stop offset=".55" stop-color="#0b1025"/><stop offset="1" stop-color="#03060e"/></radialGradient>
 <radialGradient id="glow"><stop stop-color="#fff4b3" stop-opacity=".97"/><stop offset=".27" stop-color="#fdb858" stop-opacity=".68"/><stop offset=".68" stop-color="#9d36c2" stop-opacity=".17"/><stop offset="1" stop-color="#1b1c42" stop-opacity="0"/></radialGradient>
 <linearGradient id="metal" x2="0" y2="1"><stop stop-color="#fff5ce"/><stop offset=".23" stop-color="#e8c16d"/><stop offset=".53" stop-color="#8a471f"/><stop offset=".63" stop-color="#fff0a1"/><stop offset="1" stop-color="#bd741c"/></linearGradient>
 <linearGradient id="line" x2="1" y2="0"><stop stop-color="#8e5f31"/><stop offset=".5" stop-color="#ffe6a4"/><stop offset="1" stop-color="#8e5f31"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="17"/></filter>
 <filter id="smallGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="stars" width="111" height="83" patternUnits="userSpaceOnUse"><circle cx="11" cy="21" r="1.4" fill="#fff4e9" opacity=".7"/><circle cx="74" cy="58" r="1.2" fill="#9fbcff" opacity=".6"/><circle cx="99" cy="12" r=".8" fill="#f9d8a1" opacity=".8"/></pattern>
 <clipPath id="clip"><rect x="0" y="0" width="1600" height="900"/></clipPath>
 <style>
 text{font-family:Georgia,"Times New Roman",serif;fill:#f8f0dd}
 .eyebrow{font-family:Arial,sans-serif;letter-spacing:4px;font-size:16px;font-weight:700;fill:#eac77c}
 .small{font-family:Arial,sans-serif;font-size:17px;fill:#d4d4df}
 .tiny{font-family:Arial,sans-serif;font-size:14px;fill:#c5c9d8}
 .head{font-size:29px;fill:#f5cc7c;font-weight:bold}
 .gold{fill:#f3ce8a}
 .panel{fill:#101321;fill-opacity=".88";stroke:#ae7d3a;stroke-width:1.7}
 .line{stroke:url(#line);stroke-width:2;fill:none}
 </style>
</defs>
<g clip-path="url(#clip)">
<rect width="1600" height="900" fill="url(#bg)"/>
<rect width="1600" height="900" fill="url(#stars)"/>
<path d="M-80 220 Q400 20 780 228 T1680 100" stroke="#6d3697" stroke-width="80" opacity=".16" filter="url(#blur)" fill="none"/>
<path d="M-120 390 Q430 170 790 330 T1720 240" stroke="#ef8732" stroke-width="43" opacity=".13" filter="url(#blur)" fill="none"/>
<!-- two moons -->
<circle cx="1390" cy="106" r="47" fill="#a8ceef"/><circle cx="1376" cy="89" r="35" fill="#597fbd" opacity=".3"/>
<circle cx="1502" cy="94" r="35" fill="#e9e0c9"/><circle cx="1491" cy="80" r="22" fill="#b5a987" opacity=".3"/>
<circle cx="1390" cy="106" r="57" stroke="#b4dcff" opacity=".35" fill="none"/>
<!-- header -->
<path d="M120 41H650 M950 41H1480" class="line" opacity=".5"/>
<text x="800" y="129" text-anchor="middle" font-size="116" font-weight="bold" letter-spacing="4" fill="url(#metal)" stroke="#8d4b19" stroke-width="1.3">GODSALTER</text>
<text x="800" y="165" text-anchor="middle" font-family="Arial,sans-serif" letter-spacing="13" font-weight="bold" font-size="25">THE FRANCHISE</text>
<text x="800" y="196" text-anchor="middle" class="eyebrow">BY NATHAN TABOR  •  NOVEMBER 12, 2026</text>
<text x="800" y="226" text-anchor="middle" font-style="italic" font-size="21">One Name. Three Dimensions. One Interconnected Universe.</text>
<path d="M185 245H1415" class="line"/>
<!-- portal section -->
<circle cx="800" cy="446" r="218" fill="url(#glow)" opacity=".9"/>
<circle cx="800" cy="445" r="182" fill="none" stroke="#efbd67" stroke-width="16" opacity=".27" filter="url(#smallGlow)"/>
<circle cx="800" cy="445" r="176" fill="none" stroke="url(#metal)" stroke-width="7"/>
<circle cx="800" cy="445" r="156" fill="none" stroke="#f5cf7b" stroke-width="1.6"/>
<circle cx="800" cy="445" r="137" fill="none" stroke="#c58f55" stroke-width="2" stroke-dasharray="8 12"/>
<path d="M800 300L810 417 923 446 810 457 800 588 790 457 675 446 790 417Z" fill="#f3d18b" opacity=".18" stroke="#fdd892" stroke-width="2"/>
<path d="M800 330L800 555 M690 445L910 445" stroke="#fbe8b0" stroke-width="2" filter="url(#smallGlow)"/>
<circle cx="800" cy="445" r="31" fill="#251b35" stroke="#fce0a2" stroke-width="3"/>
<text x="800" y="457" text-anchor="middle" font-size="32" font-weight="bold">0|1</text>
<!-- three dimensional panels -->
<rect class="panel" x="60" y="294" width="390" height="298" rx="17"/>
<text class="eyebrow" x="92" y="337">01 / REAL WORLD</text>
<text class="head" x="92" y="379">LITERALLY</text>
<text x="92" y="408" font-size="20" font-style="italic">THE ENTERPRISE</text>
<path class="line" d="M92 426H416"/>
<text class="small" x="92" y="465">Original products, apps, games,</text>
<text class="small" x="92" y="494">publishing, education and events.</text>
<text class="small" x="92" y="523">Licensing follows legal review.</text>
<text class="tiny" x="92" y="568">PROPOSAL • NOT A LICENSE OFFER</text>
<rect class="panel" x="1150" y="294" width="390" height="298" rx="17"/>
<text class="eyebrow" x="1182" y="337">03 / ORIGINAL FICTION</text>
<text class="head" x="1182" y="379">MYTHOLOGICALLY</text>
<text x="1182" y="408" font-size="20" font-style="italic">THE UNIVERSE</text>
<path class="line" d="M1182 426H1508"/>
<text class="small" x="1182" y="465">Two moons. Mythic portals.</text>
<text class="small" x="1182" y="494">Dirty Myrtle. Stewart. Worlds</text>
<text class="small" x="1182" y="523">that answer to the Mirror.</text>
<text class="tiny" x="1182" y="568">STORY CANON • NOT HISTORICAL FACT</text>
<!-- middle under portal -->
<rect class="panel" x="480" y="584" width="640" height="111" rx="16"/>
<text class="head" x="800" y="628" text-anchor="middle">FIGURATIVELY — THE ALTERATION</text>
<text class="small" x="800" y="659" text-anchor="middle">Question authority • Test claims • Preserve consent</text>
<text class="tiny" x="800" y="679" text-anchor="middle">02 / EVIDENCE, DISCERNMENT, ACCOUNTABILITY</text>
<!-- Lower banners -->
<rect x="58" y="714" rx="12" width="1484" height="86" fill="#151222" stroke="#e3b65b" stroke-width="2"/>
<text class="eyebrow" x="101" y="739" font-size="13">THREE NAME MIRRORS</text>
<text x="308" y="775" font-size="25" font-weight="bold">GOD'S ALTAR</text>
<path d="M566 738V783M1066 738V783" stroke="#cc9850"/>
<text x="654" y="775" font-size="25" font-weight="bold">GODS ALTER</text>
<text x="1134" y="775" font-size="25" font-weight="bold">GOD SALTER</text>
<rect x="0" y="819" width="1600" height="81" fill="#050609"/>
<path d="M0 820H1600" class="line"/>
<text class="eyebrow" x="800" y="852" text-anchor="middle" font-size="15">SOVEREIGNTY  •  CONSENT  •  TRUTH  •  PROTECTION OF INNOCENCE  •  ACCOUNTABILITY</text>
<text class="tiny" x="800" y="882" text-anchor="middle">BOOKS • FILM • GAMES • EDUCATION • MERCHANDISE • APPS • COMMUNITY • WORLDBUILDING</text>
</g>
</svg>