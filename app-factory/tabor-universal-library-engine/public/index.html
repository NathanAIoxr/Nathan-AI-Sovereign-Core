<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101c1d">
<meta name="author" content="Nathan Tabor">
<title>v.7 Tabor Universal Library Engine by Nathan Tabor</title>
<link rel="stylesheet" href="./style.css">
<script type="module" src="./app.mjs"></script>
</head>
<body>
<main>
<header class="mast">
<div><p class="credit">NATHAN TABOR</p><h1>Tabor Universal Library Engine <span>v.7</span></h1></div>
<div class="mast-actions"><button id="tilt" type="button" aria-pressed="false">Enable tilt</button><button id="reset" type="button">Reset bridge</button></div>
</header>
<section class="workspace" aria-label="Cartridge workspace">
<details class="catalog" id="catalog-panel" open>
<summary>Cartridge catalog</summary>
<div class="catalog-body">
<p id="catalog-count"></p>
<label class="field" for="search">Search title, class, or number</label><input id="search" type="search" autocomplete="off">
<label class="field" for="filter">Catalog view</label>
<select id="filter"><option value="active">Runnable cartridges</option><option value="known">Source ledger · 65–101</option><option value="all">All numbered slots</option></select>
<div id="entries" aria-label="Cartridges"></div>
<div class="catalog-links"><a href="./catalog.json" download>Original ledger JSON</a><a href="https://www.loc.gov/aba/cataloging/classification/lcco/">LC Classification</a></div>
</div>
</details>

<div class="stack">
<section class="panel top" aria-labelledby="lab-title">
<div class="lab-heading"><p id="lab-class" class="eyebrow"></p><h2 id="lab-title">Opening the loader</h2><p id="lab-description"></p></div>
<div class="viewport"><canvas id="pad" tabindex="0" aria-label="Interactive cartridge canvas. Drag or use the direction controls."></canvas><p id="placeholder" hidden></p></div>
</section>

<section class="panel bridge" aria-label="Universal Bridge">
<div><span>Enemy HP</span><strong id="enemy">180</strong></div>
<div><span>Shield</span><strong id="shield">60</strong></div>
<div><span>Loaded</span><strong id="ammo">3</strong></div>
<div><span>Charge</span><strong id="charge">0/8</strong></div>
<div><span>Reward</span><strong id="reward">Ready</strong></div>
</section>

<section class="panel bottom" aria-label="Cartridge controls">
<div class="control-row">
<div class="arrows" role="group" aria-label="Rotate or move">
<button type="button" data-motion="left" aria-label="Move left">←</button><button type="button" data-motion="up" aria-label="Move up">↑</button><button type="button" data-motion="down" aria-label="Move down">↓</button><button type="button" data-motion="right" aria-label="Move right">→</button>
</div><button class="primary" id="action" type="button">Verify engine</button>
</div>
<div id="lab-controls"></div><p id="status" role="status" aria-live="polite"></p>
<div class="puzzle"><div><h3>Bridge sequence</h3><p>Select 1 to 4 in order to reload.</p></div><div id="sequence" role="group" aria-label="Bridge sequence"></div></div>
<details id="cast-panel" class="cast"><summary>Cast</summary><div class="cast-body">
<p><strong>Grape-Apple Curator</strong> <span id="curator"></span></p>
<p><strong>Nathan AI 🚀</strong> <span id="coach"></span></p>
<label><input id="pk" type="checkbox"> PK surge mode</label><p id="pk-note"></p>
</div></details>
</section>
</div>
</section>
<section class="releases" aria-labelledby="release-title"><h2 id="release-title">Full games</h2><div id="release-links"></div></section>
</main>
</body>
</html>
