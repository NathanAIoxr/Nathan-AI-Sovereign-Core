<g font-family="Georgia,serif" fill="#402c26" text-anchor="middle"><text x="600" y="480" font-size="28" font-weight="bold">VERSE — I CAN DO BETTER</text><text x="600" y="624" font-size="31">I can do anything better than you!</text><text x="600" y="673" font-size="27">But that don't mean I'm better than you.</text><text x="600" y="715" font-size="27">You've got a gift that I haven't got.</text>
<text x="600" y="765" font-size="28" font-weight="bold">CHORUS — WE RISE TOGETHER</text>
<text x="600" y="907" font-size="30">I'll teach you everything I know,</text><text x="600" y="953" font-size="29">And you can teach me what you do.</text><text x="600" y="1000" font-size="29">I'll help you rise above my best.</text>
<text x="600" y="1045" font-size="28" font-weight="bold">THE NO-CONDITIONS PROMISE</text>
<text x="600" y="1186" font-size="28">And even if you don't teach me,</text><text x="600" y="1235" font-size="32" font-weight="bold">I'LL STILL TEACH YOU!</text><text x="600" y="1290" font-size="25">I don't have to make you smaller to grow.</text></g>
<text x="600" y="1475" text-anchor="middle" font-family="Georgia,serif" font-weight="bold" font-size="25" fill="#ffdfab">CHRISTMAS ✦ HALLOWEEN ✦ THANKSGIVING</text>
<text x="600" y="1520" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#f4c77d">DIFFERENT STRENGTHS. BRIGHTER TOGETHER.</text>
