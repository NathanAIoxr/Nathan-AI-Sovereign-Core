name = "tap-that-command-center-holding"
main = "worker.mjs"
compatibility_date = "2026-11-19"
workers_dev = false
preview_urls = false

[vars]
PROJECT_ID = "tap-that-command-center"
STAGING_ALIAS = "tap-that-command-center.test"

[observability]
enabled = true

[observability.traces]
enabled = true

[[d1_databases]]
binding = "ZONE_DB"
database_name = "zone-tap-that-command-center-db"
database_id = "ed2bcc51-ce90-443c-90ff-ed284f7c0a58"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ZONE_ASSETS"
bucket_name = "zone-tap-that-command-center-r2"

[[kv_namespaces]]
binding = "ZONE_CONFIG"
id = "5bdb42d6863b465a8f1084ce4ff9de27"

[[queues.producers]]
binding = "ZONE_JOBS"
queue = "zone-tap-that-command-center-q"

[[durable_objects.bindings]]
name = "ZONE_STATE"
class_name = "ZoneState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ZoneState"]
