name = "sovereign-website-core-holding"
main = "../worker.js"
compatibility_date = "2026-11-19"
workers_dev = false
preview_urls = false

[vars]
PROJECT_ID = "sovereign-website-core"
STAGING_ALIAS = "sovereign-website-core.test"

[[d1_databases]]
binding = "ZONE_DB"
database_name = "sovereign-website-core-holding"
database_id = "f2b38272-3774-4c7a-a2ee-3d5700a74fe6"
migrations_dir = "../../migrations"

[[r2_buckets]]
binding = "ZONE_ASSETS"
bucket_name = "sovereign-website-core-holding"

[[kv_namespaces]]
binding = "ZONE_CONFIG"
id = "828f9db52d10429182762ee043ec6a98"

[[queues.producers]]
binding = "ZONE_JOBS"
queue = "sovereign-website-core-holding"

[[durable_objects.bindings]]
name = "ZONE_STATE"
class_name = "SovereignNode"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SovereignNode"]
