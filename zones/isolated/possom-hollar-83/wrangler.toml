name = "possom-hollar-83-holding"
main = "worker.mjs"
compatibility_date = "2026-11-19"
workers_dev = false
preview_urls = false

[vars]
PROJECT_ID = "possom-hollar-83"
STAGING_ALIAS = "possom-hollar-83.test"

[observability]
enabled = true

[observability.traces]
enabled = true

[[d1_databases]]
binding = "ZONE_DB"
database_name = "zone-possom-hollar-83-db"
database_id = "71eb1450-f9c0-4cbf-84e4-e391e7df6c8c"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ZONE_ASSETS"
bucket_name = "zone-possom-hollar-83-r2"

[[kv_namespaces]]
binding = "ZONE_CONFIG"
id = "b7d86b7d2cf74a3b93f8644615fb8b80"

[[queues.producers]]
binding = "ZONE_JOBS"
queue = "zone-possom-hollar-83-q"

[[durable_objects.bindings]]
name = "ZONE_STATE"
class_name = "ZoneState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ZoneState"]
