<body><main><header><p>Nathan Tabor · Kitchen-Table HUD</p><h1>TWEEZER-OS</h1></header><blockquote>Dedicated to my precious daughter—and every parent, grandparent, aunt, and uncle who ever held a child down on the kitchen floor with tweezers.</blockquote><section class="screen terminal"><div class="meter"><span id="boot">POWERED OFF</span><span id="watchdog">04:59.00</span></div><h2>Patient telemetry</h2><meter id="telemetry" min="0" max="100" value="0"></meter><p id="patient">CALM</p><ol id="log" aria-live="polite"></ol></section><section class="panel"><div class="actions"><button id="power">BOOT</button><button id="irq">SIMULATE FLINCH</button><button id="abort">ER WATCHDOG</button></div><div id="devices" class="devices"></div></section></main></body>
