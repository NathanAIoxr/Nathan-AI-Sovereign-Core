name = "sovereign-games-holding"
main = "../worker.js"
compatibility_date = "2026-11-19"
workers_dev = false
preview_urls = false

[vars]
PROJECT_ID = "sovereign-games"
STAGING_ALIAS = "sovereign-games.test"

[[d1_databases]]
binding = "ZONE_DB"
database_name = "sovereign-games-holding"
database_id = "30ba63b6-4b12-4ecc-97a1-d94b058b6c6b"
migrations_dir = "../../migrations"

[[r2_buckets]]
binding = "ZONE_ASSETS"
bucket_name = "sovereign-games-holding"

[[kv_namespaces]]
binding = "ZONE_CONFIG"
id = "211a38f62dd64ae89d92ec368029def6"

[[queues.producers]]
binding = "ZONE_JOBS"
queue = "sovereign-games-holding"

[[durable_objects.bindings]]
name = "ZONE_STATE"
class_name = "SovereignNode"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SovereignNode"]
