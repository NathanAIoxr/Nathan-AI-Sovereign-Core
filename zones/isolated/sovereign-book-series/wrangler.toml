name = "sovereign-book-series-holding"
main = "../worker.js"
compatibility_date = "2026-11-19"
workers_dev = false
preview_urls = false

[vars]
PROJECT_ID = "sovereign-book-series"
STAGING_ALIAS = "sovereign-book-series.test"

[[d1_databases]]
binding = "ZONE_DB"
database_name = "sovereign-book-series-holding"
database_id = "d8f6564f-9146-4c51-b48a-428e9aab1063"
migrations_dir = "../../migrations"

[[r2_buckets]]
binding = "ZONE_ASSETS"
bucket_name = "sovereign-book-series-holding"

[[kv_namespaces]]
binding = "ZONE_CONFIG"
id = "efda78b475e74a63acabf88f9f372e1f"

[[queues.producers]]
binding = "ZONE_JOBS"
queue = "sovereign-book-series-holding"

[[durable_objects.bindings]]
name = "ZONE_STATE"
class_name = "SovereignNode"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SovereignNode"]
