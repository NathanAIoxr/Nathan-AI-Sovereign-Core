workers_dev = false
preview_urls = false
keep_vars = true

[observability]
enabled = false

[vars]
ACCESS_ISSUER = ""

[[d1_databases]]
binding = "ZONES"
database_name = "tabor-zone-holding"
database_id = "2b29b82e-323e-4f92-b355-1df89c67024c"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "STAGING"
bucket_name = "tabor-zone-holding-assets"

[[kv_namespaces]]
binding = "HOLDING_CONFIG"
id = "2b39811223014f30bf9050eba38adfba"
