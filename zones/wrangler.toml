name = "tabor-zone-holding"
main = "worker.js"
compatibility_date = "2026-11-19"
workers_dev = false
preview_urls = false
keep_vars = true

[observability]
enabled = false

[[d1_databases]]
binding = "ZONES"
database_name = "tabor-zone-holding"
database_id = "2b29b82e-323e-4f92-b355-1df89c67024c"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "STAGING"
bucket_name = "tabor-zone-holding-assets"

[[kv_namespaces]]
binding = "HOLDING_CONFIG"
id = "2b39811223014f30bf9050eba38adfba"


[[r2_buckets]]
binding = "PROVENANCE"
bucket_name = "tabor-sovereign-provenance"

[[durable_objects.bindings]]
name = "NODES"
class_name = "SovereignNode"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SovereignNode"]

[[queues.producers]]
binding = "AUDIT_QUEUE"
queue = "tabor-sovereign-zone-audits"

[ai]
binding = "AI"
